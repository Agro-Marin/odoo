<t>
    <!-- prefixed for the same reason as in master_input: this form is
         rendered twice (inline and in the create modal) whenever the page
         lists no database -->
    <t t-set="p" t-value="form_prefix or ''" />
    <t t-call="master_input" />
    <div class="row mb-3">
        <label t-attf-for="{{p}}dbname" class="col-md-4 col-form-label">Database Name</label>
        <div class="col-md-8">
            <input t-attf-id="{{p}}dbname" type="text" name="name" class="form-control" required autocomplete="off" t-att-pattern="pattern" title="Only alphanumerical characters, underscore, hyphen and dot are allowed"/>
        </div>
    </div>
    <div class="row mb-3">
        <label t-attf-for="{{p}}login" class="col-md-4 col-form-label">Email</label>
        <div class="col-md-8">
            <input t-attf-id="{{p}}login" type="email" name="login" class="form-control" required autocomplete="email"/>
        </div>
    </div>
    <div class="row mb-3">
        <label t-attf-for="{{p}}password" class="col-md-4 col-form-label">Password</label>
        <div class="col-md-8">
            <div class="input-group">
                <input t-attf-id="{{p}}password" type="password" name="password" class="form-control" required autocomplete="new-password"/>
                <button type="button" class="o_little_eye input-group-text" style="cursor: pointer;" aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <label t-attf-for="{{p}}phone" class="col-md-4 col-form-label">Phone Number</label>
        <div class="col-md-8">
            <input t-attf-id="{{p}}phone" type="tel" name="phone" class="form-control" autocomplete="off"/>
        </div>
    </div>
    <div class="row mb-3">
        <label t-attf-for="{{p}}lang" class="col-md-4 col-form-label">Language</label>
        <div class="col-md-8">
            <select t-attf-id="{{p}}lang" name="lang" class="form-select" required autocomplete="off">
                <t t-foreach="langs" t-as="lang">
                    <t t-if="lang[0] == 'en_US'">
                        <option t-att-value="lang[0]" t-out="lang[1]" selected/>
                    </t>
                    <t t-else="">
                        <option t-att-value="lang[0]" t-out="lang[1]"/>
                    </t>
                </t>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <label t-attf-for="{{p}}country" class="col-md-4 col-form-label">Country</label>
        <div class="col-md-8">
            <select t-attf-id="{{p}}country" name="country_code" class="form-select" autocomplete="off">
                <option value=""></option>
                <t t-foreach="countries" t-as="country">
                    <option t-att-value="country[0]" t-out="country[1]"/>
                </t>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <label t-attf-for="{{p}}load_demo_checkbox" class="col-md-4 col-form-label">Demo Data</label>
        <div class="col-md-8">
            <input type="checkbox" t-attf-id="{{p}}load_demo_checkbox" class="form-check-input" name="demo" value="1" />
        </div>
    </div>
</t>
