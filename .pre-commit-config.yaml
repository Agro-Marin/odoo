exclude: |
  (?x)(
    _vendor/|
    /static/(src/)?libs?/|
    \.svg$|
    (LICENSE.*|COPYING.*)
  )
default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # These are byte-exact expectations of what `config.save()` writes, and
        # configparser emits "key = " with a trailing space for an empty value.
        # Stripping it makes test_03_save_default_options compare a file the
        # server can never produce.
        exclude: ^odoo/addons/base/tests/config/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/JemXiaolong/pre-commit-agromarin
    rev: v3.2.0
    hooks:
      - id: agromarin-commit-format
  - repo: local
    hooks:
      - id: cross-repo-coherence
        name: cross-repo symbol coherence (core -> consumers)
        entry: python3.14 tooling/architecture/cross_repo_coherence.py --check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
