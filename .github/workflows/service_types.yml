name: Service Types Freshness

# Companion to typecheck.yml + lint.yml + doc_links.yml.
#
# Catches the drift class observed on 2026-05-10 when the
# hand-maintained ``@types/services.d.ts`` was found to have three
# stale import paths (``httpService``, ``uiService``,
# ``datetimePickerService``).  The generator
# ``tooling/codegen/generate_service_types.py`` is the source of truth;
# this gate ensures the committed ``services.d.ts`` matches the
# generator output.
#
# Unlike the typecheck/doc-link gates, this gate is **drift-zero by
# design** — there is no "tolerated baseline".  A failure means a
# service was added, moved, or renamed without running the regenerate
# script.  Two minutes of friction here saves a real bug
# (``useService("orm")`` silently resolving to ``any``) downstream.
#
# BLOCKING.  It was warn-only pending a quiet release cycle, and in the
# meantime the file it guards went stale in exactly the way it exists to
# catch: services.d.ts imported
# ``@web/components/datetime/datetime_picker_service``, a module that does
# not exist, and a second service from a file that no longer exported it.
# The gate reported it for as long as anyone had been ignoring it.  A
# warn-only freshness check on generated output is a check nobody runs.

on:
  pull_request:
    branches: ['*']
    paths:
      # Triggers when a service registration *might* have changed.
      # Conservative — false positives are cheap (the gate is fast).
      - 'addons/web/static/src/**/*.js'
      - 'addons/web/static/src/@types/services.d.ts'
      - 'tooling/codegen/generate_service_types.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  service_types:
    name: services_freshness_gate
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The repo's own target: tooling/ is py314 source. ruff.toml pins
          # target-version = py314 and enforces PEP 758's bracketless
          # `except A, B:`, which no earlier interpreter can parse -- so a gate
          # run on 3.12 dies at import, not at a finding.
          python-version: '3.14'

      - name: Run --check
        id: gate
        run: |
          set +e
          python tooling/codegen/generate_service_types.py --check 2>&1 \
            | tee /tmp/service-types-output.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          GATE_EXIT="${{ steps.gate.outputs.exit_code }}"
          {
            echo "## Service types freshness"
            echo ""
            if [ "$GATE_EXIT" = "0" ]; then
              echo "> :white_check_mark: \`@types/services.d.ts\` matches the generator output."
            else
              echo "> :warning: \`@types/services.d.ts\` is **out of sync** with the registry."
              echo ""
              echo "Run locally:"
              echo ""
              echo "    ./tooling/codegen/regen_service_types.sh"
              echo ""
              echo "Then commit the regenerated file alongside your service change."
            fi
            echo ""
            echo "Generator: \`tooling/codegen/generate_service_types.py\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate PR on failure
        if: always() && steps.gate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            core.notice(
              `Service types: @types/services.d.ts drifted from the generator output. ` +
              `Warn-only mode — does not block merge. See workflow Summary tab.`
            );
            core.warning(
              `Run \`./tooling/codegen/regen_service_types.sh\` ` +
              `and commit the diff alongside your service change.`
            );
