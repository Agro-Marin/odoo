name: Rust Extensions (odoo_rust · odoo_lint)


on:
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - 'crates/**'
      - 'odoo/libs/native.py'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  rust:
    name: fmt · clippy · test · build · symbol-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Build + install both extensions (maturin)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.0,<2.0'
          maturin build --release --manifest-path odoo_rust/Cargo.toml --out dist
          maturin build --release --manifest-path odoo_lint/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist odoo_rust odoo_lint

      - name: Symbol contract — the unconditional Python imports must resolve
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import odoo_rust, odoo_lint

          # Every accelerated symbol the framework resolves through
          # odoo/libs/accel.py, per module. Each
          # has a pure-Python twin, but CI sets ODOO_REQUIRE_NATIVE (via CI=true)
          # so the fallback is unreachable there: a symbol landing in the wrong
          # wheel is an ImportError at startup, or a lint gate that cannot run.
          required = {
              odoo_rust: [
                  "csv_export",            # addons/web/controllers/export.py
                  "fast_clone",            # odoo/libs/json/fast_clone.py
                  "rows_to_dicts",         # odoo/db/cursor.py, orm/runtime/environment.py
                  "origin_ids",            # odoo/orm/helpers.py
                  "to_prefetch_ids",       # odoo/orm/fields/base.py
                  "batch_cache_fill",      # odoo/libs/accel.py, orm/models/mixins/read.py
                  "batch_cache_filter",    # odoo/libs/accel.py
                  "batch_cache_get",       # odoo/libs/accel.py
                  "batch_group_ids",       # odoo/libs/accel.py
                  "sort_ids_by_cache",     # odoo/libs/accel.py, orm/models/mixins/traversal.py
                  "get_trigger_trees",     # odoo/libs/accel.py, orm/components/model_graph.py
              ],
              odoo_lint: [
                  "scan_byte_patterns",    # odoo/libs/lint/scan.py
                  "scan_regex_patterns",   # odoo/libs/lint/scan.py
              ],
          }
          for module, names in required.items():
              missing = [n for n in names if not hasattr(module, n)]
              if missing:
                  raise SystemExit(f"{module.__name__} is missing: {missing}")
              print(f"{module.__name__} exports all {len(names)} required symbols")

          # The runtime extension must not regain the scanner: that is the
          # whole point of the split, and nothing else would notice.
          leaked = [n for n in ("scan_byte_patterns", "scan_regex_patterns")
                    if hasattr(odoo_rust, n)]
          if leaked:
              raise SystemExit(
                  f"odoo_rust exports {leaked}; the lint scanner belongs in "
                  f"odoo_lint, which no deployment installs"
              )

          # Both must carry a build fingerprint, or odoo/libs/native.py cannot
          # tell a stale wheel from a fresh one.
          for module in required:
              if not getattr(module, "__source_crc__", None):
                  raise SystemExit(f"{module.__name__} has no __source_crc__")
          print("both extensions are fingerprinted")

          # ...and the profile they were built with, which the fingerprint
          # cannot encode: identical sources hash identically whether or not
          # the optimiser ran. The wheels above are `maturin build --release`,
          # so anything else here means the stamp is not wired up.
          for module in required:
              profile = getattr(module, "__profile__", None)
              if profile != "release":
                  raise SystemExit(
                      f"{module.__name__}.__profile__ is {profile!r}, expected "
                      f"'release' -- odoo/libs/native.py refuses to start on a "
                      f"debug build and needs this stamp to see one"
                  )
          print("both extensions are release builds")
          PY
