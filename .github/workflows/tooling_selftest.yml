name: Tooling Self-Test

# The gates in tooling/ police this repo; nothing policed them.
#
# Four workflows (ruff, lint, typecheck, architecture) already self-test the
# checker they are about to trust, but they only cover the three suites they
# happen to use. `tooling/hoot` had no workflow at all, and doc_links.yml /
# service_types.yml run their gate without running its tests — so 36 of the 182
# tooling tests executed nowhere in CI. A bare `pytest` from the repo root does
# collect them (tooling IS in pytest.ini's testpaths), but no workflow runs a
# bare pytest: every invocation names explicit paths.
#
# This job is the catch-all: the WHOLE tooling suite, on any change under
# tooling/, so a new tool is covered the day it lands rather than whenever
# someone remembers to wire it up. The per-workflow self-test steps stay where
# they are — they guarantee a gate is never trusted untested inside its own job.
#
# BLOCKING. A broken gate is worse than no gate: it reports success over code
# nobody checked, which is the exact failure mode most of these tools were
# written to end.

on:
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    # NO PATH FILTER, and that is the fix rather than the omission.
    #
    # This filter used to read `tooling/**`, `pytest.ini` and this file. That is
    # a claim that the suite only measures `tooling/`, and it is false: 35 of the
    # 76 test files here measure the repository. `test_translation_catalog`
    # checks a MEASURED block against `addons/*/i18n/*.pot`,
    # `test_architecture_doc` reads `doc/architecture/`, `test_adr_coherence`
    # reads `doc/adr/`, `test_web_machine_doc` reads `addons/web/machine_doc_v1/`,
    # `test_baseline_enforcement` reads these workflows, and the surface gates
    # read `addons/*/static/src`.
    #
    # It has already cost a red mainline. `598cf211cc2` regenerated
    # `odoo/addons/base/i18n/base.pot` and nothing else. That path matches
    # `architecture.yml`'s filter and matched NONE of the three above, so this
    # lane did not run on the PR at all — and
    # `test_translation_catalog::test_the_docstring_measurement_is_fresh` failed
    # the moment it landed, on the post-merge `push:` trigger, after the
    # merge-blocking checks had reported nothing.
    #
    # `architecture.yml` diagnosed exactly this class and abandoned enumeration
    # for it: the list is a second, hand-maintained copy of every checker's
    # scope and it rots silently. The difference here is that this suite's scope
    # is the whole repository, so the honest filter is no filter. A few
    # over-triggers are the price; `test_the_selftest_lane_has_no_path_filter`
    # in `tooling/test_ci_lanes.py` pins it.

permissions:
  contents: read

jobs:
  selftest:
    name: tooling self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The repo's own target: tooling/ is py314 source. ruff.toml pins
          # target-version = py314 and enforces PEP 758's bracketless
          # `except A, B:`, which no earlier interpreter can parse -- so a gate
          # run on 3.12 dies at import, not at a finding.
          python-version: '3.14'

      - name: Install pytest
        run: pip install --quiet "pytest==9.1.1"

      - name: Run the whole tooling suite
        # Explicit path, not a bare `pytest`: pytest.ini's addopts carry
        # --doctest-modules and the Tier-1 testpaths, and this job is only
        # about tooling/. conftest.py at the tooling root puts each tool's
        # directory on sys.path so the sibling tests can import it.
        run: python -m pytest tooling/ -q
