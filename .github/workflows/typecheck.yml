name: TypeScript Check

# Four blocking type-check gates over the JS layer (none use continue-on-error):
#
#   1. tsc ratchet         — project-wide error COUNT, floor in
#                            tooling/ratchet/baselines/tsc.json. Covers every
#                            module; catches aggregate drift, names no file.
#   2. strictNullChecks    — DEFAULT-DENY per-file lock over the web module.
#   3. noImplicitAny       — same, and it is what makes (2) real: `any` is
#                            null-safe by fiat, so an implicit-any value slips
#                            through a strictNullChecks lock untouched.
#   4. tsc_serviceworker   — count ratchet over the service-worker lane, which
#                            the first three cannot see at all: lib.dom and
#                            lib.webworker cannot share a program, so what they
#                            report for a worker is measured against `Window`.
#                            One tsc run per DEPLOYED ROUTE, summed.
#
# Gates 2 and 3 are default-deny (tooling/typecheck): every .js/.ts under
# a gated module's static/{src,tests} must be clean unless it is listed in
# tooling/typecheck/exceptions/<gate>/<module>.txt, and that list may only
# shrink (currently one gated module: web). A new
# or renamed file is therefore gated from its first commit — the allowlist model
# this replaced enforced only what it happened to enumerate, which silently left
# 448 already-clean files unlocked and let a rename delete a lock outright.
#
# Two properties those gates depend on, both easy to lose silently:
#   - the gate configs set checkJs, so the lock covers every .js file rather
#     than only the ones carrying a `// @ts-check` pragma. Without it the
#     source files, not the gate, decide what is enforced.
#   - both tsc runs pass --listFiles, and the gate REQUIRES it: the file list
#     proves the compile happened, and it is what detects an in-scope file that
#     is absent from the program (`unchecked`). A file nothing compiles reports
#     no errors, and a default-deny gate would otherwise count that silence as
#     a file locked at zero.
#
# To move a floor or a list, run locally and commit the result:
#   npx tsc -p tsconfig.json --noEmit 2>&1 | tee /tmp/tsc.log
#   python tooling/ratchet/ratchet.py tsc --count "$(grep -c 'error TS' /tmp/tsc.log)" --update
#   npx tsc -p tsconfig.strict.json --noEmit --listFiles > /tmp/strict.log 2>&1 || true
#   python tooling/typecheck/scope_gate.py strict --log /tmp/strict.log --update
#
# Do not restate a floor's value in this comment — two copies drift, and they
# did: this header once read 2002 while the baseline said 2274 and reality was
# 2155. The value and its history live in the baseline/exception files.

on:
  # Mainline re-verification: re-run the gates on every push to a protected
  # branch so direct commits / merge-skew cannot silently drift them.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - '**/*.js'
      - '**/*.ts'
      - '**/*.d.ts'
      - 'tsconfig.json'
      - 'tsconfig.strict.json'
      - 'tsconfig.noimplicitany.json'
      - 'tsconfig.serviceworker*.json'
      - 'jsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tooling/ratchet/**'
      - 'tooling/typecheck/**'
      - '.github/workflows/typecheck.yml'

permissions:
  contents: read

jobs:
  typecheck:
    name: tsc --noEmit (ratchet + default-deny locks)
    runs-on: ubuntu-latest
    # Three full-program tsc runs over ~8200 files. Locally each is ~90s; the
    # hosted runner is slower, so leave real headroom above the observed time.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Self-test the gates
        # Both gates are verified before any verdict is trusted, the same way
        # architecture.yml self-tests its layering checker.
        run: |
          python tooling/ratchet/test_ratchet.py
          python tooling/typecheck/test_scope_gate.py
          python tooling/typecheck/test_excepted_budget.py

      - name: Install dependencies
        # npm ci, not npm install: the tsc version is pinned in package-lock and
        # a different minor reports a different error set, which would drift
        # every floor and exception list at once.
        run: npm ci

      - name: Run tsc (base config)
        id: tsc
        run: |
          set +e
          npx tsc --project tsconfig.json --noEmit 2>&1 | tee /tmp/tsc-output.log
          set -e
          # `|| true`, NOT `|| echo 0`: `grep -c` PRINTS "0" and THEN exits 1
          # when it matches nothing, so the `||` branch appends a SECOND "0"
          # and the count becomes the two-line string "0\n0", which is
          # invalid in $GITHUB_OUTPUT (one `key=value` per line). Latent only
          # while this floor is above zero -- it would break CI on precisely
          # the run that finally reached zero.
          ERR_COUNT=$(grep -c "error TS" /tmp/tsc-output.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce tsc ratchet
        run: |
          python tooling/ratchet/ratchet.py tsc --count "${{ steps.tsc.outputs.error_count }}" --json | tee /tmp/verdict.json
          python tooling/ratchet/ratchet.py tsc --count "${{ steps.tsc.outputs.error_count }}"

      - name: strictNullChecks gate (default-deny over the web module)
        run: |
          set +e
          npx tsc --project tsconfig.strict.json --noEmit --listFiles > /tmp/tsc-strict.log 2>&1
          set -e
          python tooling/typecheck/scope_gate.py strict --log /tmp/tsc-strict.log

      - name: strictNullChecks excepted-file budgets
        # scope_gate answers one question per file — clean, or excepted. For an
        # excepted file the answer stops there: it may hold 5 errors or 500, and
        # may go from 5 to 500 with the lock still reporting "excepted" and the
        # project ratchet absorbing the difference in a four-figure aggregate.
        # Two defects had already landed through that gap, both found by
        # reading. Same log, so this costs no extra tsc run.
        run: python tooling/typecheck/excepted_budget.py strict --log /tmp/tsc-strict.log

      - name: noImplicitAny gate (default-deny over the web module)
        run: |
          set +e
          npx tsc --project tsconfig.noimplicitany.json --noEmit --listFiles > /tmp/tsc-noimplicitany.log 2>&1
          set -e
          python tooling/typecheck/scope_gate.py noimplicitany --log /tmp/tsc-noimplicitany.log

      - name: noImplicitAny excepted-file budgets
        run: python tooling/typecheck/excepted_budget.py noimplicitany --log /tmp/tsc-noimplicitany.log

      - name: Service-worker lane (lib.webworker, one program per route)
        id: sw
        # Three runs, not one: a TS program is a global scope and each deployed
        # worker is its own, so a single program makes their top-level consts
        # collide. The three counts are summed into one floor -- what matters is
        # that this scope stops growing, and splitting the floor three ways would
        # only make a file moving between routes look like drift.
        run: |
          set +e
          TOTAL=0
          for lane in web pos event; do
            npx tsc --project "tsconfig.serviceworker.$lane.json" --noEmit \
              > "/tmp/tsc-sw-$lane.log" 2>&1
            N=$(grep -c "error TS" "/tmp/tsc-sw-$lane.log" || true)
            echo "  $lane: $N"
            TOTAL=$((TOTAL + N))
          done
          set -e
          echo "error_count=${TOTAL}" >> "$GITHUB_OUTPUT"

      - name: Enforce service-worker ratchet
        run: python tooling/ratchet/ratchet.py tsc_serviceworker --count "${{ steps.sw.outputs.error_count }}"

      - name: Summarise
        if: always()
        run: |
          ERR_COUNT="${{ steps.tsc.outputs.error_count }}"
          BASELINE=$(python -c "import json;print(json.load(open('tooling/ratchet/baselines/tsc.json'))['count'])")
          {
            echo "## TypeScript checks"
            echo ""
            echo "### Project-wide count (ratchet)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| Errors found | ${ERR_COUNT} |"
            echo "| Committed floor | ${BASELINE} |"
            echo "| Drift | $((ERR_COUNT - BASELINE)) |"
            echo ""
            echo "### Web-module locks (default-deny)"
            echo ""
            echo "| Gate | Verdict |"
            echo "|------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for gate in strict noimplicitany; do
            log="/tmp/tsc-${gate}.log"
            if [ -f "$log" ]; then
              line=$(python tooling/typecheck/scope_gate.py "$gate" --log "$log" 2>/dev/null | head -1)
            else
              line="not run"
            fi
            echo "| \`${gate}\` | ${line:-no verdict} |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo ""
            echo "Floor: \`tooling/ratchet/baselines/tsc.json\` · Locks: \`tooling/typecheck/exceptions/\`"
          } >> "$GITHUB_STEP_SUMMARY"
