name: Python Lint (ruff)

# Python lint gate. CLAUDE.md / doc/coding_guidelines.rst require new Python to
# pass `ruff check`, but no CI gate enforced it — this closes that gap.
#
# Enforced as a DRIFT-ZERO RATCHET (tooling/ratchet): the committed floor is
# tooling/ratchet/baselines/ruff.json. This gate BLOCKS. The floor only moves
# one way — see tooling/ratchet/README.md. To change it, run locally and commit:
#   N=$(ruff check odoo/ --no-cache --statistics | awk '{s+=$1} END {print s}')
#   python tooling/ratchet/ratchet.py ruff --count "$N" --update
#
# ruff is pinned in requirements-dev.txt (0.16.2); the floor must be measured
# with that pin so local and CI agree.
#
# The pin is now a HARD floor, not just a reproducibility aid, and there are two
# independent reasons for that. ruff.toml runs with `explicit-preview-rules` and names
# individual preview rules, so a ruff that predates any of them refuses to start
# ("Unknown rule selector") instead of degrading. Since the 0.16.2 bump it also sets
# `output-prefer-rule-codes`, a config key 0.16.0 does not know, and an unknown key is
# a TOML parse failure reported against line 1 — it does not even name the field's real
# location. Bumping ruff DOWN, or forgetting one of the three pin sites in this repo
# (here, requirements-dev.txt, .pre-commit-config.yaml), breaks the gate outright rather
# than shifting the count. Two more pins live outside this repo: the enterprise and
# agromarin .pre-commit-config.yaml files. They pin the same ruff so the three repos
# format identically — NOT because they read this file.
#
# No repo extends this ruff.toml any more. enterprise and agromarin each carry a
# standalone copy, because `extend` fails CLOSED: a missing extend target aborts ruff
# instead of skipping the include, so a wrapper reading only the exit code cannot
# distinguish "config broken" from "no findings". Both repos had already been broken
# that way by a path that resolved nowhere. The rule families are therefore duplicated
# on purpose; the headers of ../enterprise/ruff.toml and ../agromarin/ruff.toml carry
# the rationale and the `diff` recipe for resyncing them after a change here.

on:
  # Mainline re-verification: re-run the ratchet on every push to a protected
  # branch so direct commits / merge-skew cannot silently drift the floor.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - 'odoo/**/*.py'
      - 'ruff.toml'
      - 'requirements*.txt'
      # The whole of tooling/, not only the ratchet: the gates themselves were
      # outside every CI lint scope, so ruff findings in them (including an
      # F811 that left a dead, shadowed `module_scope_param` in hoot_lib) never
      # blocked anything. The local pre-commit hook would have caught it, but
      # hooks are opt-in and were not installed.
      - 'tooling/**'
      # tests/ for the same reason as tooling/: it sat outside every lint
      # scope, so seven findings accumulated there unnoticed.
      - 'tests/**'
      - '.github/workflows/ruff.yml'

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ruff (pinned)
        run: pip install "ruff==0.16.2"

      - name: Self-test the ratchet
        run: python tooling/ratchet/test_ratchet.py

      - name: Lint tooling/ and tests/ at zero
        # The gates that police this repo were themselves unlinted: the ratchet
        # scope is `odoo/` only. Both trees are small and clean today, so they
        # get a hard zero rather than a floor — no ratchet bookkeeping, and a
        # finding here blocks instead of hiding inside a 539-error aggregate.
        #
        # tests/ was added after the same gap showed up there: unlinted, it had
        # quietly collected seven findings, among them two `assert_raises_
        # exception` on `pytest.raises(Exception)` blind catches that let an
        # unrelated AttributeError satisfy a rollback test.
        run: ruff check tooling/ tests/ --no-cache --output-format=concise

      - name: Run ruff
        id: ruff
        run: |
          set +e
          # --no-cache: keep the count deterministic for the exact-match ratchet
          # (a stale/partial ruff cache yields a slightly different total).
          ruff check odoo/ --no-cache --output-format=concise | tee /tmp/ruff.log
          set -e
          # --statistics gives the authoritative per-rule totals; sum them.
          ERR_COUNT=$(ruff check odoo/ --no-cache --statistics 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet
        run: |
          python tooling/ratchet/ratchet.py ruff --count "${{ steps.ruff.outputs.error_count }}" --json | tee /tmp/verdict.json
          python tooling/ratchet/ratchet.py ruff --count "${{ steps.ruff.outputs.error_count }}"

      - name: Run C901 (cyclomatic complexity)
        id: c901
        # A SECOND floor, deliberately not folded into the aggregate above.
        # ruff.toml ignores C901 so it stays out of that count; `--select` on the
        # CLI overrides the ignore, and `[lint.mccabe] max-complexity = 20`
        # supplies the threshold. Keeping it separate keeps it legible: in one
        # bucket a complexity fix could be masked by an unrelated new finding,
        # and the point of a floor is that a cleanup locks in.
        #
        # It gated nothing until now. ruff.toml selected the C90 family, ignored
        # C901 (its only rule) and set max-complexity — three settings that
        # cancel out — while the two branch-complexity rules each justified their
        # suppression by naming the other, both being off.
        run: |
          set +e
          ruff check odoo/ --no-cache --select C901 --output-format=concise | tee /tmp/c901.log
          set -e
          C901_COUNT=$(ruff check odoo/ --no-cache --select C901 --statistics 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "count=${C901_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce C901 ratchet
        run: |
          python tooling/ratchet/ratchet.py c901 --count "${{ steps.c901.outputs.count }}" --json | tee /tmp/verdict-c901.json
          python tooling/ratchet/ratchet.py c901 --count "${{ steps.c901.outputs.count }}"

      - name: Summarise
        if: always()
        run: |
          ERR_COUNT="${{ steps.ruff.outputs.error_count }}"
          BASELINE=$(python -c "import json;print(json.load(open('tooling/ratchet/baselines/ruff.json'))['count'])")
          C901_COUNT="${{ steps.c901.outputs.count }}"
          C901_BASE=$(python -c "import json;print(json.load(open('tooling/ratchet/baselines/c901.json'))['count'])")
          # This step is `if: always()`, so the C901 step may not have produced
          # an output. Render that as a dash rather than doing arithmetic on an
          # empty string, which would make the summary itself fail.
          if [ -n "${C901_COUNT}" ]; then
            C901_ROW="| C901 (complexity) | ${C901_COUNT} | ${C901_BASE} | $((C901_COUNT - C901_BASE)) |"
          else
            C901_ROW="| C901 (complexity) | — | ${C901_BASE} | — |"
          fi
          {
            echo "## Python lint (ruff ratchet)"
            echo ""
            echo "| Gate | Findings | Floor | Drift |"
            echo "|------|---------:|------:|------:|"
            echo "| ruff (aggregate) | ${ERR_COUNT} | ${BASELINE} | $((ERR_COUNT - BASELINE)) |"
            echo "${C901_ROW}"
            echo ""
            echo "Config: \`ruff.toml\` · Floors: \`tooling/ratchet/baselines/{ruff,c901}.json\` · Scope: \`odoo/\`"
          } >> "$GITHUB_STEP_SUMMARY"
