name: Architecture Boundaries

# Enforces the framework-core layering contracts (documented in
# doc/architecture/module.md) via the dependency-free checker
# tooling/architecture/layer_check.py. The facade-boundary contract
# governs BOTH addon trees (odoo/addons/ and the sibling addons/).
#
# BLOCKING by design. Unlike the typecheck/lint gates, this gate has no
# "tolerated baseline" to ramp down: the checker already reports zero NEW
# violations, and the pre-existing debt is pinned in the checker's
# KNOWN_VIOLATIONS allowlist. A *new* layering crossing is a real regression
# (a re-introduced import cycle, or framework code leaking into a
# dependency-free module), so it should block the merge that introduces it.
#
# To soften to warn-only during a transition, set `continue-on-error: true`.

on:
  # Mainline re-verification. Every push to a protected branch re-runs the gate
  # so direct commits and merge-skew cannot silently drift past it. No path
  # filter here on purpose: mainline is always re-checked in full.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      # WHOLE-TREE, NOT PER-PACKAGE, and deliberately so.
      #
      # This filter used to enumerate the core packages one by one. Enumeration
      # is the wrong shape for it: the list is a second, hand-maintained copy of
      # every checker's scope, and it silently rots as packages are added. It
      # had: `odoo/api/**`, `odoo/fields/**`, `odoo/models/**` and `odoo/tests/**`
      # were all real packages inside the checkers' scope (they appear in
      # layer_check's core source tuple, libs_facade_check.SCANNED_TREES and
      # env_model_surface_check.SCOPE_PACKAGES) and NONE of them was listed
      # here — so a PR touching only those ran no gate at all and was caught,
      # if at all, by the post-merge `push:` trigger, i.e. after the
      # merge-blocking check had already reported nothing. That is the same
      # failure ADR-0009 recorded and fixed once already.
      #
      # `odoo/**` + `addons/**` costs a few over-triggers (the job is ~1 min)
      # and makes the whole class unrepresentable. test_ci_path_filter_covers_
      # every_scanned_tree (tooling/architecture/) pins it.
      - 'odoo/**'
      - 'addons/**'
      # test_adr_coherence.py fact-checks doc/adr/ (index ↔ files, cross-refs,
      # referenced repo paths) — an ADR edit must retrigger it.
      - 'doc/adr/**'
      # The JS gates (js_layer_check, js_cycle_check, named_export_coherence)
      # read client source under both addon trees; `odoo/**` and `addons/**`
      # above already cover every `static/src/**` path they scan, so the three
      # former per-tree JS globs here were redundant.
      # These two are the only scanned paths outside those trees:
      - 'tooling/architecture/**'
      - '.github/workflows/architecture.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  layers:
    name: layer_check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The repo's own target: tooling/ is py314 source. ruff.toml pins
          # target-version = py314 and enforces PEP 758's bracketless
          # `except A, B:`, which no earlier interpreter can parse -- so a gate
          # run on 3.12 dies at import, not at a finding.
          python-version: '3.14'

      - name: Set up Node
        # Two gates in this job shell out to the JS toolchain rather than
        # reimplementing a parser: `js_function_length` injects a rule into
        # ESLint, and `js_patch_blind_facade` parses with acorn. Both resolve
        # their tool from `node_modules/`, which is gitignored — without this
        # step they raise "not found (run `npm ci`)" and the step fails on a
        # clean tree, which reads as a finding rather than a missing tool.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS toolchain
        run: npm ci

      - name: Test the checker
        # The checker is load-bearing CI infrastructure; verify its own logic
        # (relative-import resolution, TYPE_CHECKING skipping, contract matching)
        # before trusting its verdict. Stdlib-only suite, fast.
        run: |
          pip install --quiet "pytest==9.1.1"
          python -m pytest tooling/architecture/ -q

      - name: Run layer check
        id: layers
        # ONE invocation, with --check. It prints the same readable report as a
        # bare run and additionally exits 1 on a new violation, so the previous
        # two-invocation form paid for the whole scan twice (~3.9s here, and
        # 12s across the four gates in this job). It was also silently wrong:
        # `exit_code` was captured from the BARE run, which returns 0 whatever
        # it finds, so "Annotate PR on failure" could never fire.
        run: |
          set +e
          python tooling/architecture/layer_check.py --check | tee /tmp/layers.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run mixin coupling check
        id: mixin_coupling
        # Complements layer_check, which reasons about IMPORT edges and is
        # structurally blind here: BaseModel's 26 mixins are composed by
        # multiple inheritance and collaborate through `self`, which produces no
        # import at all. So the framework's most intricate coupling surface --
        # the one place a decomposition can quietly rot back into a god object
        # -- moved no gate. This ratchets the self-call graph: largest cycle,
        # total inter-unit edges, and the largest cycle excluding base.py (which
        # is 2, not 9 -- the mixins are nearly a DAG, and base.py is in the cycle
        # only because it is both composition root and metadata holder).
        #
        # Exact-mode, like tooling/ratchet/: an improvement that does not lower
        # BASELINE also fails, so a cleanup is locked in rather than re-spent.
        run: |
          set +e
          python tooling/architecture/mixin_coupling_check.py --check \
            | tee /tmp/mixin_coupling.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run JS mixin coupling check
        id: js_mixin_coupling
        # The JS half of the step above, and blind in exactly the same way for
        # exactly the same reason. SearchModel is composed from five mixin
        # factories that collaborate through `this`, so js_layer_check (imports)
        # and js_private_access (cross-module member access) both see nothing:
        # the addon's private-access report contains zero entries in search/,
        # not because the coupling is absent but because a mixin merges into its
        # host class and leaves no edge to detect.
        #
        # It does NOT ask for the chain to be dismantled -- js_service_shape
        # records it as one of four legitimate extension seams, patchable with
        # `super`, and downstream addons use it. It ratchets the shape so the
        # composition cannot get more tangled unnoticed. Measured today: a
        # single strongly-connected component over all six units, every one of
        # the twelve edges cyclic. The Python gate reports max_scc 1.
        #
        # Needs node: the graph comes from espree, not a regex, because `this`
        # in a nested arrow belongs to the enclosing method while `this` in a
        # nested function does not, and brace counting cannot tell them apart.
        run: |
          set +e
          python tooling/architecture/js_mixin_coupling.py --check \
            | tee /tmp/js_mixin_coupling.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run subsystem-map check
        id: subsystem_map
        # Gates the DESCRIPTIVE half of the architecture docs -- the subsystem
        # map, which lives in doc/architecture/module.md -- which every other
        # gate here ignores: layer_check enforces who may import whom, and
        # doc_link_gate proves a referenced .md exists, but nothing proved the
        # subsystem map still matches the tree. It had drifted into depicting
        # db/connectivity, db/resilience, http/serving and http/features as
        # subdirectories -- none of which exist -- and the invented `core` node
        # masked the real, undocumented http/core.py. A map that describes a
        # layout the reader cannot find is worse than no map.
        #
        # Blocking, and at zero: the two rules are "no fictional paths" and "an
        # enumeration that starts must finish", both mechanical.
        run: |
          set +e
          python tooling/architecture/subsystem_map_check.py --check \
            | tee /tmp/subsystem_map.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run package-index check
        id: package_index
        # The per-package companion to subsystem_map_check: odoo/db/README.md
        # ("Module map") and odoo/_monkeypatches/README.md ("Patch Index") are
        # the best documentation in the tree and had the least protection. db's
        # README even invites additions -- "Add the check here when you add an
        # invariant above" -- with nothing enforcing it.
        #
        # Symmetric rule: every module in the package is in the index, and every
        # module in the index exists. Scoped to the inventory SECTION, because
        # both READMEs carry other tables naming .py files -- _monkeypatches'
        # "Recently Removed" correctly names six modules that are gone, and an
        # unscoped scan reports all six as failures against a correct document.
        run: |
          set +e
          python tooling/architecture/package_index_check.py --check \
            | tee /tmp/package_index.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run env-surface check
        id: env_surface
        # The second gate aimed at coupling the IMPORT graph cannot see, and the
        # same argument as mixin_coupling_check one level up. layer_check's
        # orm-layer1-below-models-and-runtime and orm-models-below-runtime are
        # clean and always will be -- because Layers 1 and 2 do not reach the
        # runtime by importing it, they reach it through `self.env` on every
        # call, which produces no import edge. Measured, Layer 1 (orm/fields) is
        # the HEAVIEST consumer of Environment's private internals, wider than
        # Layer 2: the layering story is true of the import graph and false of
        # the runtime graph.
        #
        # It also validates that every reached member EXISTS on Environment,
        # including the four `env.__dict__["_field_cache_memo"]` string-key hot
        # paths. Renaming that member is caught by nothing else: ruff is blind,
        # mypy sees only the 2 plain-attribute sites (and only as an anonymous
        # +2 in a count-ratcheted pool), and the four __dict__ sites are
        # try/except KeyError guarded -- so the fast path would silently degrade
        # to a permanent slow path with no test failing.
        run: |
          set +e
          python tooling/architecture/env_surface_check.py --check \
            | tee /tmp/env_surface.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run Layer → Registry (pool) surface check
        id: pool_surface
        # The sibling of env_surface_check, for the channel that argument
        # missed. `self.pool` IS the Registry, so every `model.pool.<member>` is
        # a Layer-N -> Layer-3 access that produces no import edge and moves no
        # other gate. Measured, it shows the same inversion more sharply than
        # `env` does: orm/fields (Layer 1) reaches the Registry at 30 sites
        # against orm/models' 17, including a private member and 5
        # pool[<model>] subscripts that Layer 2 never uses.
        #
        # Ratchets three things: no unsanctioned pool._private from Layers 0-2,
        # every referenced member must EXIST on Registry, and components/ must
        # not touch pool at all -- the runtime half of the purity claim
        # orm-components-are-pure-python makes about imports. Public-surface
        # width is reported, not ratcheted, for the same reason as the env gate.
        run: |
          set +e
          python tooling/architecture/pool_surface_check.py --check \
            | tee /tmp/pool_surface.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run framework → addon-model surface check
        id: env_model_surface
        # The string-keyed sibling of core-does-not-depend-on-addons. That
        # import-based contract is blind to the framework's largest real coupling
        # to its own consumer: ~30 addon-owned models reached through
        # env["res.users"] / self.env["ir.attachment"] subscripts, which compile
        # to no import at all. This ratchets the SET of models exact-mode, so new
        # coupling from core (and genuine decoupling) both surface instead of
        # creeping. It does not forbid the coupling -- several of these models are
        # framework-essential despite living in base -- it bounds and reveals it.
        run: |
          set +e
          python tooling/architecture/env_model_surface_check.py --check \
            | tee /tmp/env_model_surface.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run worker-thread surface check
        id: worker_thread_surface
        # The third gate aimed at coupling the import graph cannot see (siblings:
        # env_surface and env_model_surface). Odoo stashes per-request identity
        # -- dbname, uid, the SQL counters, cursor_mode -- as attributes on the
        # threading.Thread object; framework infrastructure reads them back. The
        # WorkerThread Protocol (odoo/libs/worker_thread.py) types that contract,
        # but the bare `threading.current_thread().dbname` idiom it replaces is
        # invisible to mypy (undeclared on Thread) and to layer_check (no import,
        # no env access). This ratchets the inline-access set exact-mode; core is
        # fully converted, so the baseline is EMPTY and any new raw access fails.
        run: |
          set +e
          python tooling/architecture/worker_thread_surface_check.py --check \
            | tee /tmp/worker_thread_surface.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run odoo.libs façade check
        id: libs_facade
        # The mirror of ADR-0008's facade-boundary, for the dependency-free
        # utility layer. That contract stops addons importing odoo.orm.*;
        # nothing stopped them importing odoo.libs internals, and 124 leaf-module
        # paths had accumulated -- which made libs/'s FILE LAYOUT public API
        # (renaming libs/web/urls.py broke 51 call sites).
        #
        # Not a layer_check contract, and the reason is structural: its
        # _ImportCollector emits a synthetic <base>.<name> for every
        # `from <base> import <name>`, so `from odoo.libs.numbers import
        # float_round` yields odoo.libs.numbers.float_round -- indistinguishable
        # BY NAME from the module odoo.libs.numbers.float_utils. Contract.allow
        # is prefix-matched, so allowing the area would allow every leaf under
        # it. The discriminator is on disk (does a module of that path exist?),
        # which the Contract model cannot ask.
        run: |
          set +e
          python tooling/architecture/libs_facade_check.py --check \
            | tee /tmp/libs_facade.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run mail hook keyword-surface check
        id: mail_hook_keywords
        # mail is a framework, and its own suite cannot reach the addons that
        # implement its extension points. 28ed9db3341 added a `tracking_values`
        # keyword to `_notify_by_email_prepare_rendering_context` and merged
        # green: /mail and /test_mail neither override the hook nor could, so
        # nothing in the module's 866 tests saw the six overrides it had just
        # broken -- 108 TypeErrors, one per notified create, in project, crm,
        # account, account_peppol, base_order and enterprise/hr_appraisal.
        #
        # A contract rather than a ratchet: an override that cannot accept a
        # keyword the framework passes is a TypeError waiting for the right
        # record to be saved, and there is no count of those worth carrying.
        #
        # This lane checks out odoo alone, so it measures the community
        # overrides; enterprise/ and agromarin/ run the same script with
        # --roots from their own cross-repo lane, as naming_vocabulary and
        # js_public_surface already do.
        run: |
          set +e
          python tooling/architecture/mail_hook_keyword_check.py --check \
            | tee /tmp/mail_hook_keywords.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run SQL placeholder contract
        id: sql_placeholder
        # psycopg 2 interpolated parameters client-side; psycopg 3 binds them
        # server-side, so two shapes that used to work now cannot execute at
        # all. `IN %s` leaves as `IN $1` -- `syntax error at or near "$1"` --
        # and a tuple parameter adapts to a composite rather than an array:
        # `malformed array literal`. Both are invisible until the statement
        # runs, and all five occurrences found so far were found that way.
        #
        # `IN %s` had taken Chilean invoicing down on every invoice post, and
        # the whole l10n_cl_edi suite with it; the tuple half had made merging
        # mailing lists and reading their statistics raise. Neither is a query
        # anyone would read as wrong.
        #
        # A contract rather than a ratchet: a statement that cannot execute has
        # no count worth carrying.
        #
        # This lane checks out odoo alone, so it measures the community tree;
        # enterprise/ and agromarin/ run the same script with --roots from
        # their own cross-repo lane, which is where two of the five lived.
        run: |
          set +e
          python tooling/architecture/sql_placeholder.py --check \
            | tee /tmp/sql_placeholder.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run Python import-cycle check
        id: py_cycles
        # The Python half of what js_cycle_check.py does for the client. Both
        # layer gates lock import DIRECTION and are blind to cycles: every edge
        # of a cycle can sit inside one layer and cross no boundary, so
        # layer_check would report a tangle of mutually-importing modules as
        # perfectly clean.
        #
        # Python hides this better than ESM, which is what makes it accumulate:
        # a partially-initialised module is a live object, so a cycle usually
        # *works* -- until someone imports the package by a different entry
        # point, or moves a statement above the one that happened to break the
        # knot, and it becomes an ImportError or an AttributeError on a
        # half-built module, far from the change that caused it.
        #
        # Function-local imports are deliberately NOT edges: a deferred import
        # is the sanctioned way to break a cycle, and counting it would flag
        # every seam that already fixes the problem.
        run: |
          set +e
          python tooling/architecture/py_cycle_check.py --check | tee /tmp/py_cycles.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run JS layer check
        id: js_layers
        # Same drift-zero contract as the Python gate, for the web addon's
        # Feature-Sliced JS layers (shared < entity < feature < widget < page).
        # Blocking by design: a new upward import is a real regression.
        run: |
          set +e
          python tooling/architecture/js_layer_check.py --check | tee /tmp/js_layers.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run JS deployment-layer check
        id: js_deployment_layers
        # The other half of JS layering. js_layer_check locks `web`'s
        # Feature-Sliced order (a concern hierarchy over top-level directories,
        # one addon). This locks the *deployment-context* layers `mail` and its
        # satellites use — `common` / `public_web` / `web_portal` / `web` /
        # `public` as a path SEGMENT — where the rule is bundle subset, not a
        # rank: a file may import another only if the target ships everywhere
        # the importer does. Blocking, and at zero from day one.
        #
        # The failure it catches never shows up in a unit suite: `common/`
        # ships in `mail.assets_public`, the standalone anonymous-discuss
        # bundle that contains no `web/` layer at all, so a `common -> web`
        # import is `undefined` at runtime on that page and nowhere else.
        run: |
          set +e
          python tooling/architecture/js_deployment_layers.py --check | tee /tmp/js_deployment_layers.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run JS import-cycle check
        id: js_cycles
        # Complements the layering gate, which locks import *direction* and is
        # blind to *cycles*: every edge of a cycle can sit inside one layer and
        # break no contract. Scans EVERY addon's client source, not just web's,
        # for the same reason the named-export gate does — a cycle in mail or
        # point_of_sale fails identically. Blocking, because a cycle's damage
        # depends on
        # evaluation order rather than on the code — `core/py_js` carried a
        # six-module cycle whose unsafe entry orders threw a ReferenceError
        # under native ESM and, under `esbuild --bundle`, silently built a
        # lookup table with `undefined` keys. The shipped order happened to be
        # the safe one, so 1904 passing JS tests said nothing about it.
        run: |
          set +e
          python tooling/architecture/js_cycle_check.py --check | tee /tmp/js_cycles.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run named-export coherence check
        id: named_exports
        # Blocking, and at zero from day one: an `import { x }` with no
        # matching export is a LINK-time SyntaxError under native ESM, so it
        # does not degrade one feature — it kills the whole asset bundle for
        # every database installing that module. No JS suite can catch it
        # either: the bundle never boots, so the run reports fewer tests
        # rather than a failure.
        #
        # CI checks out this repo alone, so the cross-repo half only runs
        # where sibling checkouts are present: the sibling repos' own
        # architecture workflows (which check out this repo alongside), and
        # dev clones that ran tooling/install-hooks.sh to get the pre-push
        # cross_repo_coherence hook. Intra-repo drift is fully covered here.
        run: |
          set +e
          python tooling/architecture/named_export_coherence.py --check \
            | tee /tmp/named_exports.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run JS suite/source parity check
        id: js_parity
        # Blocking. HOOT derives a suite's id from the test file's path, so when
        # source moves and its tests do not, nothing fails: the suites still run
        # and still pass under their old id. What breaks is selecting a module's
        # tests by where its source lives — invisible to every other gate here,
        # because no import is wrong and no file is missing.
        run: |
          set +e
          python tooling/architecture/js_suite_parity.py | tee /tmp/js_parity.log
          python tooling/architecture/js_suite_parity.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS layer-cohesion check
        id: js_cohesion
        # Blocking. The layer gate orders the layers and the cycle gate keeps
        # them acyclic; neither asks whether a directory is a module at all.
        # `services/` was not — 20 registered singletons sharing a registration
        # call and no dependency on one another — and a namespace shaped like a
        # layer is what lets unrelated files accumulate behind a plausible name.
        run: |
          set +e
          python tooling/architecture/js_layer_cohesion.py --table \
            | tee /tmp/js_cohesion.log
          python tooling/architecture/js_layer_cohesion.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS import-resolution check
        id: js_resolution
        # Blocking. An ES module whose specifier does not resolve never
        # evaluates, and for a test file that means the suite registers
        # NOTHING: `0 failed / 0 passed`, or simply a smaller total in a summed
        # run. The failure is silent in exactly the place a suite is meant to be
        # loud — six suites and 96 tests stopped running on HEAD this way, when
        # moving the field tests two directories deeper left their `../../`
        # prefixes behind. Scans every addon, since the specifier and the file
        # it names need not live in the same one.
        run: |
          set +e
          python tooling/architecture/js_import_resolution.py \
            | tee /tmp/js_resolution.log
          python tooling/architecture/js_import_resolution.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS self-bridge check
        id: js_self_bridge
        # Blocking, and at zero from day one. A generated ESM bridge written
        # over the source it was generated from makes the module resolve
        # itself, so every export it names is `undefined` while every import of
        # it still links. Four `web` modules sat that way on 2026-08-03: the
        # web client stopped rendering its navbar and 320 Hoot tests failed,
        # and every other gate in this workflow stayed green — a bridge
        # re-exports the same names (so the export gates pass) and imports
        # nothing (so the graph gates pass).
        run: |
          set +e
          python tooling/architecture/js_self_bridge.py \
            | tee /tmp/js_self_bridge.log
          python tooling/architecture/js_self_bridge.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS forced-render check
        id: js_forced_render
        # Blocking, and at zero from day one. `component.render(true)` sweeps a
        # whole subtree and, in doing so, hides reads that subscribe to nothing:
        # while `useModelWithSampleData` installed a blanket forced render for
        # every view, four view controllers never wrapped their model in
        # `useState` and a kanban progress-bar getter closed over the wrong
        # proxy, and all of it looked correct. Removing the blanket (2026-08-09)
        # surfaced both. Web core only; other addons are counted, not faulted.
        run: |
          set +e
          python tooling/architecture/js_forced_render.py \
            | tee /tmp/js_forced_render.log
          python tooling/architecture/js_forced_render.py --check
          rc=$?
          # Web core is drift-zero above; this floor covers every other addon,
          # where a forced render is sometimes legitimate and converting one
          # needs that domain's tests. It stops the number growing meanwhile.
          python tooling/architecture/js_forced_render.py --count \
            | xargs python tooling/ratchet/ratchet.py jsforcedrender --count
          ratchet_rc=$?
          [ "$rc" -eq 0 ] && rc=$ratchet_rc
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS patch-blind facade check
        id: js_patch_blind_facade
        # Blocking, and at zero from day one. ~35 of `web`'s 38 services are a
        # closure returning an object literal, and downstream extends them by
        # patching `start` and mutating that object. A call inside `start` that
        # names the closure identifier instead of the facade captures the
        # pre-patch function, so the patch reaches external consumers and
        # silently skips that caller. `enterprise/knowledge` neutralizes the
        # command palette for portal users this way; the direct calls were
        # blocked and Ctrl+K still opened it, because `command_service.js`
        # registered the hotkey against the closure. Nine such call sites
        # existed across six services on 2026-08-04. Nothing else here can see
        # it: no import, no export, no graph edge — just one function in a
        # scope calling another.
        run: |
          set +e
          python tooling/architecture/js_patch_blind_facade.py \
            | tee /tmp/js_patch_blind_facade.log
          python tooling/architecture/js_patch_blind_facade.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run Python function-length ratchet
        id: py_funclen
        # The Python half of the pair. Ratchets EXCESS LINES above the 80-line
        # budget, not the count of offenders: splitting one long function into
        # several merely-long ones raises the count while lowering the excess,
        # and the count metric would reject that improvement. See the module
        # docstring.
        run: |
          set +e
          python tooling/architecture/py_function_length.py | tee /tmp/py_funclen.log
          python tooling/architecture/py_function_length.py --count \
            | xargs python tooling/ratchet/ratchet.py pyfunclen --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run Python function-length ratchet (addons)
        id: py_funclen_addons
        run: |
          set +e
          python tooling/architecture/py_function_length.py --addon addons \
            | tee /tmp/py_funclen_addons.log
          python tooling/architecture/py_function_length.py --count --addon addons \
            | xargs python tooling/ratchet/ratchet.py pyfunclen_addons --mode no-increase --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run Python function-length ratchet (mail)
        id: py_funclen_mail
        # The Python half of the `--addon mail` pair. `pyfunclen` measures
        # `odoo/`, the core package, so Python function length in `addons/mail`
        # -- the largest addon in the tree -- was floored by nothing, while its
        # JS half has been floored since 2026-07. Excess lines above the budget,
        # like `pyfunclen`, not the count of offenders.
        run: |
          set +e
          python tooling/architecture/py_function_length.py --addon mail | tee /tmp/py_funclen_mail.log
          python tooling/architecture/py_function_length.py --addon mail --count \
            | xargs python tooling/ratchet/ratchet.py pyfunclen_mail --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS function-length ratchet
        id: js_funclen
        # A count ratchet rather than a contract: nothing bounded how long a JS
        # function may be, and the longest is 738 lines. Reports its own number
        # and hands it to the shared ratchet, so the floor may only fall.
        run: |
          set +e
          python tooling/architecture/js_function_length.py | tee /tmp/js_funclen.log
          python tooling/architecture/js_function_length.py --count \
            | xargs python tooling/ratchet/ratchet.py jsfunclen --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS function-length ratchet (mail)
        id: js_funclen_mail
        # The same budget, pointed at the second-largest JS tree in the repo,
        # which this gate did not reach: 54 functions over 80 lines against
        # web's 148. The debt has a different shape here -- the longest are
        # Record `setup()` bodies and service `start()`s, three of them the
        # `Thread` model assembled across 14 files -- so this number moves when
        # `Thread` shrinks, not with a formatting pass.
        run: |
          set +e
          python tooling/architecture/js_function_length.py --addon mail | tee /tmp/js_funclen_mail.log
          python tooling/architecture/js_function_length.py --addon mail --count \
            | xargs python tooling/ratchet/ratchet.py jsfunclen_mail --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run method-naming vocabulary ratchet
        id: naming_vocab
        # doc/coding_guidelines.rst §2.4 fixes one canonical verb per operation.
        # A count ratchet rather than a contract, because the tree opens with 274
        # of these: a blocking gate would fail every build on day one and be
        # switched off within the week. It counts the mechanically decidable
        # rules only -- the abolished-verb list -- so the floor is one anybody can
        # lower by reading §2.4.
        run: |
          set +e
          python tooling/architecture/naming_vocabulary.py | tee /tmp/naming_vocab.log
          python tooling/architecture/naming_vocabulary.py --count \
            | xargs python tooling/ratchet/ratchet.py naming --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run translation-catalogue ratchet
        id: translation_catalog
        # `_()` looks a string up by exact source text. Reflow the literal and the
        # lookup misses, silently: the call still returns, the string still renders,
        # and it renders in English for every reader who asked for something else.
        # Nothing fails and nothing logs, so only a gate can see it. Found because
        # both of mail.alias's bounce bodies -- built by `_alias_with_author_lang`,
        # whose whole purpose is the sender's language -- shipped their principal
        # sentence in English while the wrapper around it was translated.
        #
        # A count ratchet, not a contract: the drift tracks how much a module has
        # been rewritten, which is what this fork does, so the tree opens with
        # hundreds. It does NOT measure whether a translation exists -- that is a
        # translator's job -- only whether the msgid a running server asks for was
        # ever exported.
        #
        # RED BECAUSE OF A STRING SOMEONE JUST WROTE? The fix is
        # `odoo-bin i18n export -c <conf> -d <db> <module>`, NOT a floor move: moving
        # it books the new string as permanent debt, where the export removes it. The
        # floor is for debt being accepted, not for a string just introduced.
        run: |
          set +e
          python tooling/architecture/translation_catalog.py | tee /tmp/translation_catalog.log
          python tooling/architecture/translation_catalog.py --count \
            | xargs python tooling/ratchet/ratchet.py translations --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run compute depends_context ratchet
        id: compute_ctx
        # A non-stored compute's cache is keyed by its field's depends_context, so
        # one that resolves env.user without declaring "uid" serves the first
        # reader's answer to every user in the transaction. A test transaction has
        # one uid, which is why no test catches it -- and why this is a gate rather
        # than a test. Syntactic on purpose: the accurate check needs the registry,
        # and test_lint.yml installs only test_lint, so the one module where this
        # has actually shipped (mail) would not be in it.
        run: |
          set +e
          python tooling/architecture/compute_context_deps.py | tee /tmp/compute_ctx.log
          python tooling/architecture/compute_context_deps.py --count \
            | xargs python tooling/ratchet/ratchet.py computectx --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS private-access ratchet
        id: js_private
        # A count ratchet, wired here after an audit found it orphaned: the gate
        # and its baseline (tooling/ratchet/baselines/jsprivate.json) existed, but
        # no workflow fed `--count` into ratchet.py and ratchet.py has no run-all
        # mode, so a cross-module private-access regression merged green (HEAD sat
        # at 254 against a 253 floor). The gate's *cross-layer* verdict (which must
        # be zero) is already exercised by the pytest step above; this step adds
        # the shrink-only enforcement of the total the pytest tests explicitly
        # leave "ratcheted elsewhere".
        run: |
          set +e
          python tooling/architecture/js_private_access.py | tee /tmp/js_private.log
          python tooling/architecture/js_private_access.py --count \
            | xargs python tooling/ratchet/ratchet.py jsprivate --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS service-shape ratchet
        id: js_serviceshape
        # Same story as js_private above: baselines/jsserviceshape.json was fed by
        # no workflow. Ratchets the count of services still returning an object
        # literal from start() (vs a class), so the facade-patch surface can only
        # shrink. The real-tree shape assertions run in the pytest step; this pins
        # the number.
        run: |
          set +e
          python tooling/architecture/js_service_shape.py | tee /tmp/js_serviceshape.log
          python tooling/architecture/js_service_shape.py --count \
            | xargs python tooling/ratchet/ratchet.py jsserviceshape --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS service-shape ratchet (mail)
        id: js_serviceshape_mail
        # 5 of mail's 22 services return an object literal, against web's 13 of
        # 42 -- better per service, and measured by nothing until now. The
        # budget is the literal TOTAL, not the oversized ones: counting only the
        # long literals falls when someone extracts a helper, which moves the
        # number without adding the prototype seam this is about.
        run: |
          set +e
          python tooling/architecture/js_service_shape.py --addon mail | tee /tmp/js_serviceshape_mail.log
          python tooling/architecture/js_service_shape.py --addon mail --count \
            | xargs python tooling/ratchet/ratchet.py jsserviceshape_mail --count
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS public-surface ratchet
        id: js_surface
        # Blocking. `web` publishes no API: every file under static/src is
        # reachable as `@web/<path>`, and 327 specifiers are imported from
        # outside the addon, 276 of them into module internals. That is why
        # relocating half of `services/` cost 338 downstream edits and
        # dissolving the rest cost ~500 more. This does not draw the boundary —
        # it pins the surface so it can only shrink, which is what has to come
        # first and gets harder every day it waits.
        #
        # CI checks out this repo alone, so this run judges the `odoo`
        # consumer scope of the provenance-tagged pin; the sibling-scoped
        # entries are validated by the sibling repos' own architecture
        # workflows, which check out this repo alongside. Regenerating the pin
        # (--update) requires the full workspace and refuses anything less.
        run: |
          set +e
          python tooling/architecture/js_public_surface.py | tee /tmp/js_surface.log
          python tooling/architecture/js_public_surface.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS public-surface ratchet (mail)
        id: js_surface_mail
        # The same ratchet, pointed at the second governed addon. `mail` has the
        # same property as `web` and the second-largest JS tree in the repo: 93
        # specifiers reached from outside it, 88 of them from production code and
        # 90 three or more segments deep into internals (two independent
        # partitions of the 93 — the shallow three are `@mail/model/*`, the one
        # top-level directory left without a deployment-layer suffix).
        #
        # It was pinned BEFORE the layout work it protects, and that work has
        # since happened: `views/fields/` and the whole of `js/` are folded into
        # the layer scheme, and every one of those moves showed up here as a
        # reviewable rename rather than as a silent break in a
        # separately-versioned consumer repo.
        run: |
          set +e
          python tooling/architecture/js_public_surface.py --addon mail | tee /tmp/js_surface_mail.log
          python tooling/architecture/js_public_surface.py --addon mail --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run JS extension-surface ratchet
        id: js_extension_surface
        # Blocking, judged per consumer scope. `js_public_surface` pins which
        # `@web/*` MODULES other addons import; this pins which METHODS they
        # override. The two are not the same contract: the first guarantees
        # `@web/views/form` keeps existing, the second that `FormController`
        # keeps having a `beforeExecuteActionButton`.
        #
        # Nothing checked the second before this. Renaming that method inside
        # `web`, with all 19 downstream overriders left untouched, produced an
        # identical architecture run (3 failed / 909 passed both sides) and a
        # tsc count equal to the committed floor — because no gate models
        # inheritance, the consuming side is not typechecked, and 18 of the 19
        # overriding classes have no test that names them.
        #
        # CI checks out this repo alone, so this run judges the `odoo` scope of
        # the provenance-tagged pin; sibling scopes are validated by the sibling
        # repos' own architecture workflows. Regenerating (--update) requires
        # the full workspace and refuses anything less.
        run: |
          set +e
          python tooling/architecture/js_extension_surface.py | tee /tmp/js_extension_surface.log
          python tooling/architecture/js_extension_surface.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run env.config declared-shape gate
        id: js_env_config_surface
        # Blocking, judged per consumer scope, and the third distinct contract
        # in this family. `js_public_surface` pins the MODULES other addons
        # import; `js_extension_surface` pins the METHODS they override; this
        # pins the KEYS they read out of `env.config` — a bag inherited through
        # the component tree, so it is neither an import nor a class member and
        # neither of the other two can see it.
        #
        # Before it: five writers in `web` alone, and three keys `web` never
        # writes at all. `enterprise/mrp_mps` keeps its pager offset/limit in
        # web's bag; `enterprise/web_studio` reaches `onNodeClicked` from eleven
        # sites, one of them interpolated into generated QWeb source.
        #
        # CI checks out this repo alone, so this run judges the `web` and `odoo`
        # scopes; sibling scopes ride the pin's provenance tags and are judged
        # where those checkouts exist. --update refuses anything less than the
        # full workspace.
        run: |
          set +e
          python tooling/architecture/js_env_config_surface.py --check | tee /tmp/js_env_config.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

      - name: Run archInfo surface gate
        id: js_arch_info_surface
        # Blocking. `archInfo` is what an ArchParser returns and what a view's
        # model, controller, renderer and compiler all read by name. One slice
        # of it has no static protection anywhere: the compiler does not READ
        # `archInfo.fieldNodes`, it emits that text into a template it registers
        # with OWL, so until OWL compiles it the key is a string — invisible to
        # tsc, to ESLint, and to every import- or member-based gate here.
        #
        # Measured: renaming `fieldNodes` in `list_arch_parser.js` alone left
        # tsc at 2106 errors (its exact floor) and the whole architecture suite
        # with an identical failure set to pristine HEAD, while breaking 509 of
        # 577 list-view Hoot tests. This gate exits 1 on it.
        run: |
          set +e
          python tooling/architecture/js_arch_info_surface.py --check \
            | tee /tmp/js_arch_info.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run field-widget record surface gate
        id: js_field_record_surface
        # Blocking. `standardFieldProps` is four keys and one of them is
        # `record: { type: Object }` — a live RelationalRecord, 83 own members
        # before anything inherited, handed to all 155 field widgets across the
        # four checkouts. That is the real interface of every widget in the
        # fork, and no other gate can see it: the record arrives as a prop, so
        # it is neither an import (js_public_surface) nor a class member
        # (js_extension_surface), and every member reached is public
        # (js_private_access).
        #
        # Also reports the split that makes a narrower `FieldHandle` prop a
        # decision rather than a guess: 101 widgets reach only the own-value
        # surface, 38 name a sibling field or reach `record.model`.
        run: |
          set +e
          python tooling/architecture/js_field_record_surface.py --check \
            | tee /tmp/js_field_record.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${GATE_EXIT}"

      - name: Run XML reference-coherence check
        id: xml_refs
        # Blocking, judged per consumer scope. Half the client's dependency
        # graph is strings in XML: `widget="…"` resolves in the fields /
        # formatters / grid_components registries (by view type),
        # `js_class="…"` in views, `<widget name="…"/>` in view_widgets, and
        # `t-call`/`t-inherit` against every shipped `t-name`. None of it is
        # an import and the ORM never checks it, so a renamed registry key
        # fails only at runtime — silently, for widgets, which fall back to
        # the default rendering. The 14 pre-existing danglers are pinned
        # (xml_reference_coherence.txt, shrink-only per scope); a NEW one
        # fails, and a fixed one must shrink the pin. This repo-alone
        # checkout judges the `odoo` consumer scope; sibling scopes are
        # judged wherever their checkouts are present alongside this one.
        run: |
          set +e
          python tooling/architecture/xml_reference_coherence.py \
            | tee /tmp/xml_refs.log
          python tooling/architecture/xml_reference_coherence.py --check
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          exit $rc

