name: Doc Link Check

# Phase 1 of the doc-link CI gate (companion to typecheck.yml + lint.yml).
#
# BLOCKING. Scoped to this repo's own documentation, the baseline is EMPTY:
# every `.md` reference in it resolves. It was warn-only while it also
# scanned sibling checkouts it cannot verify and carried a ~478-entry
# tolerated baseline; removing that scope removed the reason to tolerate.
#
# What the gate catches: dangling references to `*.md` files in
# CI workflows, machine_doc_v1, CLAUDE.md surfaces, the core package
# READMEs, the ADR log, and the architecture document set. Three real
# instances motivated this gate (the
# 2026-04-19-web-module-architecture-review.md ref in CONVENTIONS.md
# and STATE_MANAGEMENT.md, the 2026-04-28-typecheck-ci-gate-plan.md
# ref in this very file's sibling typecheck.yml, and the
# 2026-05-03-web-js-architecture-audit.md ref in lint.yml line 17 —
# all referenced docs that were never written or were renamed/deleted
# without updating the citing file).
#
# Why Python (not Node like the sibling gates): the script scans
# source files directly — no upstream tool to consume output from.
# Python's pathlib/regex/json stdlib is enough; adding a node_modules
# dependency just to match language would be net negative.

on:
  # Mainline re-verification, matching architecture.yml / ruff.yml / lint.yml.
  # This gate was the only blocking one of the four with no `push:` trigger,
  # so a direct commit or a merge skew that dangled a reference was caught by
  # nothing until the next PR happened to touch a `.md`. That is exactly the
  # bypass ADR-0009 closed elsewhere, left open here. No path filter on
  # purpose: mainline is always re-checked in full.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      # .md changes are the most direct trigger — the file content
      # itself may add or remove references.
      - '**/*.md'
      # Workflow / config changes can introduce or remove references
      # in their YAML comments.
      - '**/*.yml'
      - '**/*.yaml'
      # doc_symbol_gate checks documented *exports*, so renaming or deleting
      # one invalidates a doc claim without touching a single `.md`. That is
      # the direction the `derived` defect travelled in reverse, and a filter
      # on markdown alone would never see it.
      - '**/*.js'
      # The gate scripts themselves, the baseline, or the next-target ranker.
      - 'tooling/doclinks/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  doc_links:
    name: doc_link_gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # BLOCKING. The baseline is empty: this repo's own docs have zero broken
    # .md references. The gate was warn-only while it also scanned sibling
    # checkouts and carried a ~478-entry tolerated baseline; scoped to this
    # repo there is nothing left to tolerate, so a new broken reference is a
    # regression and should block the commit that introduces it.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The repo's own target: tooling/ is py314 source. ruff.toml pins
          # target-version = py314 and enforces PEP 758's bracketless
          # `except A, B:`, which no earlier interpreter can parse -- so a gate
          # run on 3.12 dies at import, not at a finding.
          python-version: '3.14'

      - name: Run doc_link_gate.py
        id: gate
        run: |
          set +e
          python tooling/doclinks/doc_link_gate.py 2>&1 \
            | tee /tmp/doc-link-output.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          # Count `✗` lines as the new-violation indicator (mirrors
          # typecheck.yml's `error TS` grep approach).  A clean run
          # has zero `✗` lines and prints `✓ No new violations`.
          #
          # `|| true`, NOT `|| echo 0`: `grep -c` PRINTS "0" and THEN exits 1
          # when it matches nothing, so the `||` branch appended a SECOND "0"
          # and NEW_COUNT became the two-line string "0\n0". That is written
          # straight into $GITHUB_OUTPUT, whose format is one `key=value` per
          # line, so the stray `0` line makes Actions reject the whole file
          # ("Invalid format '0'") — and it fired on the CLEAN path, which here
          # is the normal one, since the baseline is empty and the gate is
          # green. `exit_code` is set on the very next line and would be lost
          # with it, defaulting the annotate step's `!= '0'` test to true.
          NEW_COUNT=$(grep -c "^✗" /tmp/doc-link-output.log || true)
          echo "new_count=${NEW_COUNT}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          # BLOCKING, as this workflow's header has always claimed. The exit
          # status was captured and recorded but never propagated — alone among
          # the gate steps in this repo, all thirteen of architecture.yml's end
          # with exactly this line — so a new broken reference produced a notice
          # and a green check. The baseline is empty and every reference in the
          # tree resolves, so there is nothing left to tolerate.
          exit "${GATE_EXIT}"

      - name: Run doc_symbol_gate.py
        # BLOCKING at a hard zero, with no baseline. A documented symbol either
        # is exported or is not; there is no partial state to ratchet toward,
        # and the one legitimate shape — a page naming an absent symbol in
        # order to warn about it — is enumerated in the gate's
        # DELIBERATE_ABSENCES with its reason.
        #
        # Runs as its own step rather than folded into the one above so the
        # two failures stay distinguishable: a broken `.md` path is a
        # documentation edit, a missing export is usually a code edit that
        # left a document behind.
        run: python tooling/doclinks/doc_symbol_gate.py

      - name: Summarise
        if: always()
        run: |
          NEW_COUNT="${{ steps.gate.outputs.new_count }}"
          # Baseline value drifts as the team cleans up — reading it from
          # the JSON keeps the summary self-consistent.
          BASELINE=$(python -c "
          import json, sys
          try:
              data = json.load(open('tooling/doclinks/baselines/doc_link_baseline.json'))
              print(data.get('_total_violations', 0))
          except Exception:
              print(0)
          ")
          {
            echo "## Doc link check"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| New violations | ${NEW_COUNT} |"
            echo "| Baseline (allowed) | ${BASELINE} |"
            echo ""
            if [ "$NEW_COUNT" -gt 0 ]; then
              echo "> :warning: This PR introduces ${NEW_COUNT} new broken \`.md\` reference(s)."
              echo "> Either fix the reference path or, if intentional, run"
              echo "> \`python tooling/doclinks/doc_link_gate.py --update-baseline\`"
              echo "> and commit the baseline diff."
            else
              echo "> :white_check_mark: No new broken doc references."
            fi
            echo ""
            echo "BLOCKING: the baseline is empty, so any new broken reference fails this job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate PR on failure
        if: always() && steps.gate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const newCount = parseInt('${{ steps.gate.outputs.new_count }}', 10) || 0;
            core.error(
              `Doc-link gate: ${newCount} new broken .md reference(s). ` +
              `This blocks the merge. See workflow Summary tab.`
            );
            if (newCount > 0) {
              core.warning(
                `New broken doc references introduced by this PR. ` +
                `Either fix the path, or run --update-baseline if intentional.`
              );
            }
