name: Python Type Check

# Python counterpart to typecheck.yml (TypeScript). Runs mypy over the modern
# framework packages (config: mypy.ini) and enforces a DRIFT-ZERO RATCHET via
# tooling/ratchet: the committed floor is tooling/ratchet/baselines/mypy.json.
#
# This gate BLOCKS (no continue-on-error). The ratchet only moves one way:
#   * more errors than the baseline  -> fail (regression).
#   * fewer errors than the baseline -> fail too, asking you to commit the lower
#     baseline in the same PR, so every improvement is locked in and the floor
#     can never silently slip back. See tooling/ratchet/ratchet.py.
#
# To change the floor, reproduce THIS job's environment -- mypy and nothing else,
# on a clean checkout -- and commit the result. Running it in a working venv
# instead is what put the floor at 1379, a count no environment produces: with
# the project dependencies installed, mypy resolves lxml/psycopg/dateutil to real
# stubs and finds 87 MORE errors than this job does (1384 vs 1297, measured
# 2026-08-08), so a floor taken there can never be reproduced by the gate
# enforcing it, and the exact-match ratchet then fails every run.
#
#   python3 -m venv /tmp/mypyenv && /tmp/mypyenv/bin/pip install mypy==2.3.0
#   git worktree add --detach /tmp/clean HEAD   # the shared tree carries other work
#   cd /tmp/clean && /tmp/mypyenv/bin/mypy --no-incremental --config-file mypy.ini \
#     -p odoo.orm -p odoo.db -p odoo.libs -p odoo.http -p odoo.service -p odoo.modules \
#     2>&1 | tee /tmp/mypy.log
#   N=$(grep -cE ": error:" /tmp/mypy.log)
#   python tooling/ratchet/ratchet.py mypy --count "$N" --update --note '<what moved and why>'
#
# mypy is pinned in requirements-dev.txt (2.3.0), and THE FLOOR IS VERSION-
# SPECIFIC: 1.19.1 measured 1297 on the tree where 2.3.0 measures 1293. Move the
# pin and the baseline in one commit, in both this file and requirements-dev.txt.

on:
  # Mainline re-verification: re-run the ratchet on every push to a protected
  # branch so direct commits / merge-skew cannot silently drift the floor.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - 'odoo/orm/**/*.py'
      - 'odoo/db/**/*.py'
      - 'odoo/libs/**/*.py'
      - 'odoo/http/**/*.py'
      - 'odoo/service/**/*.py'
      - 'odoo/modules/**/*.py'
      # The seventh scope, checked by its own step against its own floor. A
      # gate whose paths do not name the tree it measures is a gate that does
      # not run on the change most likely to move it.
      - 'odoo/tools/**/*.py'
      # The eighth scope, same argument as the seventh. odoo/cli is every
      # entry point odoo-bin exposes and was in no type gate's scope at all.
      - 'odoo/cli/**/*.py'
      # The ninth scope, same argument again. odoo/tests is the test framework
      # every addon test runs on, and its `tests` directory name kept it out of
      # this gate and out of every _sources-based one.
      - 'odoo/tests/**/*.py'
      # The tenth and eleventh scopes. `odoo/*.py` is not a stray glob: the
      # seven top-level modules are named one by one with -m, and logutils.py
      # alone held 23 of the 40 errors those two lanes opened on. Without these
      # six globs a PR touching only the tree a lane was added for would not run
      # that lane -- the same defect the seventh scope's note describes,
      # reintroduced by the commit that closed the scope gap. Checked under
      # GitHub's filter-pattern semantics, where `*` does not span a separator:
      # an fnmatch probe calls `odoo/*.py` a match for
      # `odoo/_monkeypatches/ast.py` and GitHub does not.
      - 'odoo/*.py'
      - 'odoo/api/**/*.py'
      - 'odoo/fields/**/*.py'
      - 'odoo/models/**/*.py'
      - 'odoo/_monkeypatches/**/*.py'
      - 'odoo/upgrade_code/**/*.py'
      - 'mypy.ini'
      - 'requirements*.txt'
      - 'tooling/ratchet/**'
      # The scope gate, its self-test, and the lists it enforces. Without this
      # a PR that only edits an exception list would not run the gate that
      # reads it — which is the one edit most likely to be wrong.
      - 'tooling/typecheck/py_scope_gate.py'
      - 'tooling/typecheck/test_py_scope_gate.py'
      - 'tooling/typecheck/exceptions/mypy/**'
      - 'tooling/typecheck/budgets/mypy-*.json'
      - '.github/workflows/py_typecheck.yml'

permissions:
  contents: read

jobs:
  mypy:
    name: mypy (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install mypy
        run: pip install "mypy==2.3.0"

      - name: Self-test the scope gate
        # Same argument as the ratchet self-test below: a checker whose own
        # logic is broken reports green over code it never read. This one
        # additionally pins the count-neutral swap that the ratchet cannot see,
        # which is the reason the scope gate exists.
        run: python tooling/typecheck/test_py_scope_gate.py

      - name: Self-test the ratchet
        # Prove the enforcement tool is sound before trusting its verdict —
        # mirrors how architecture.yml self-tests the layer checker.
        run: python tooling/ratchet/test_ratchet.py

      - name: Run mypy
        id: mypy
        # Module mode (`-p`), not path mode: passing directories makes mypy see
        # the same file under both `orm.*` and `odoo.orm.*` ("found twice").
        # mypy does static analysis only — ignore_missing_imports (mypy.ini)
        # means the heavy runtime deps (lxml, …) need NOT be installed here.
        run: |
          set +e
          # --no-incremental: the count must be deterministic for an exact-match
          # ratchet. mypy's incremental cache yields slightly different totals
          # depending on cache state; a clean run is stable.
          # --verbose is required by the scope gate, not by the ratchet: without
          # the "LOG:  Parsing <file>" lines a file mypy SKIPPED is
          # indistinguishable from a file mypy found clean, and the gate would
          # count it as locked while nothing enforces it. It does not perturb
          # the count -- verified, no verbose line matches ": error:".
          python -m mypy --no-incremental --config-file mypy.ini \
            -p odoo.orm -p odoo.db -p odoo.libs -p odoo.http -p odoo.service -p odoo.modules \
            --verbose 2>&1 | tee /tmp/mypy.log
          set -e
          # `|| true`, NOT `|| echo 0`: `grep -c` PRINTS "0" and THEN exits 1
          # when it matches nothing, so the `||` branch appends a SECOND "0"
          # and the count becomes the two-line string "0\n0", which is
          # invalid in $GITHUB_OUTPUT (one `key=value` per line). Latent only
          # while this floor is above zero -- it would break CI on precisely
          # the run that finally reached zero.
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet
        id: ratchet
        # Single source of truth for the verdict; exits non-zero on any drift.
        run: |
          python tooling/ratchet/ratchet.py mypy \
            --count "${{ steps.mypy.outputs.error_count }}" --json | tee /tmp/verdict.json
          python tooling/ratchet/ratchet.py mypy --count "${{ steps.mypy.outputs.error_count }}"

      - name: Run mypy (odoo.tools)
        id: mypy_tools
        # A SEPARATE SCOPE, AND A SEPARATE FLOOR. odoo.tools is not folded into
        # the six-package count above: one integer over seven packages would
        # make every future move ambiguous between the two scopes, the way
        # c901 and c901_addons are kept apart for exactly that reason.
        #
        # The package was annotated everywhere and checked by nothing, so the
        # annotations asserted nothing -- 69 of them said `: object` for what is
        # an Environment, a FrameType, a Callable or an IO stream. Three defects
        # found in the audit that opened this floor were visible to a type
        # checker and to nothing else in CI: `parse_config` annotated `-> None`
        # and returning a value, a token field holding bytes and then int, and
        # `translate_xml_node` taking a `parse` argument it never read.
        run: |
          set +e
          python -m mypy --no-incremental --config-file mypy.ini \
            -p odoo.tools --verbose 2>&1 | tee /tmp/mypy_tools.log
          set -e
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy_tools.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet (odoo.tools)
        run: |
          python tooling/ratchet/ratchet.py mypy_tools --count "${{ steps.mypy_tools.outputs.error_count }}" --json | tee /tmp/verdict_tools.json
          python tooling/ratchet/ratchet.py mypy_tools --count "${{ steps.mypy_tools.outputs.error_count }}"

      - name: Run mypy (odoo.cli)
        id: mypy_cli
        # AN EIGHTH SCOPE, AND AN EIGHTH FLOOR, for the reason the odoo.tools
        # step above gives: one integer over several scopes makes every future
        # move ambiguous between them.
        #
        # odoo/cli is every entry point odoo-bin exposes -- server, shell, db,
        # i18n, obfuscate, upgrade_code, populate, neutralize -- and it was in
        # NO type gate's scope: mypy.ini names the six framework packages and
        # odoo.tools carries its own. It measured 55 errors in 8 of its 16
        # files the first time anyone ran it, among them a version comparison
        # annotated tuple[int, ...] against a parse_version that returns
        # tuple[str, ...], an importlib spec dereferenced without its None
        # check, and a bootstrap_config whose str|None return was assigned
        # straight into a str field by five of its six callers.
        #
        # A HARD ZERO WITH NO BASELINE FILE, so this scope has no fungible slack at all
        # and any new error fails on its own. --verbose is for the per-file
        # lock step below, which needs cli's "LOG:  Parsing" lines to tell a
        # file it found clean from a file it never opened.
        run: |
          set +e
          python -m mypy --no-incremental --config-file mypy.ini \
            -p odoo.cli --verbose 2>&1 | tee /tmp/mypy_cli.log
          set -e
          # `|| true`, NOT `|| echo 0` -- see the note on the six-package step.
          # That note called the bug "latent only while this floor is above
          # zero"; THIS floor is zero, so the spelling is load-bearing here on
          # every green run rather than on some future one.
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy_cli.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet (odoo.cli)
        run: |
          python tooling/ratchet/ratchet.py mypy_cli --count "${{ steps.mypy_cli.outputs.error_count }}" --json | tee /tmp/verdict_cli.json
          python tooling/ratchet/ratchet.py mypy_cli --count "${{ steps.mypy_cli.outputs.error_count }}"

      - name: Run mypy (odoo.tests)
        id: mypy_tests
        # A NINTH SCOPE, AND A NINTH FLOOR, and it is here for the reason the
        # odoo.cli step above gives -- with one twist worth stating, because it
        # is why this package went unmeasured for longer than cli did.
        #
        # odoo/tests is the test *framework*: TransactionCase, HttpCase, Form,
        # the Chrome CDP driver, the suite runner and the result reporter. It is
        # production code that every addon test in the repository runs on. But
        # its directory is named `tests`, and `tooling/architecture/_sources.py`
        # calls any path with a `tests` component a test path -- so the package
        # is also invisible to py_function_length, sql_in_placeholder,
        # py_count_as_boolean, py_x2many_count, compute_context_deps and every
        # test_lint AST rule. It was clean on all of those when this landed; it
        # measured 250 mypy errors, in 13 of its 14 modules.
        #
        # A HARD ZERO WITH NO BASELINE FILE, as cli's: all 250 were fixed rather than
        # banked, so this scope has no fungible slack and any new error fails on
        # its own. --verbose is for the per-file lock step below.
        run: |
          set +e
          python -m mypy --no-incremental --config-file mypy.ini \
            -p odoo.tests --verbose 2>&1 | tee /tmp/mypy_tests.log
          set -e
          # `|| true`, NOT `|| echo 0` -- see the note on the six-package step.
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy_tests.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet (odoo.tests)
        run: |
          python tooling/ratchet/ratchet.py mypy_tests --count "${{ steps.mypy_tests.outputs.error_count }}" --json | tee /tmp/verdict_tests.json
          python tooling/ratchet/ratchet.py mypy_tests --count "${{ steps.mypy_tests.outputs.error_count }}"

      - name: Run mypy (rest of core)
        id: mypy_core_rest
        # A TENTH SCOPE, AND A TENTH FLOOR: everything left in odoo/ that the
        # nine scopes above do not name -- the three ORM façades, the two
        # upgrade trees, _monkeypatches, and the seven top-level modules.
        #
        # These were in NO lane until 2026-08-30, which is not the same as
        # being clean and reads identically from `ratchet.py --list`: a scope
        # nothing measures and a scope measuring zero both show no errors. They
        # held 40 -- 15 in _monkeypatches and 25 in three top-level modules,
        # nearly all of them logutils.py.
        #
        # One of the 40 was a live defect, not a typing nit. PostgreSQLHandler
        # called `tools.sql.column_exists`, and `odoo.tools.sql` had been
        # deleted by `025bfb53b19`; the call sits inside
        # contextlib.suppress(Exception), so every boot swallowed the
        # AttributeError and left _support_metadata pinned to False. Nothing
        # else in CI could see it -- the suppression makes it invisible at
        # runtime and the module is imported by every process.
        #
        # A HARD ZERO WITH NO BASELINE FILE, as cli's and tests': all 40 were fixed
        # rather than banked. tooling/typecheck/test_py_scope_coverage.py is
        # what keeps the union of these ten scopes equal to the tree, so a new
        # core package cannot repeat the gap.
        run: |
          set +e
          # odoo/upgrade is deliberately absent: it holds a .gitkeep and no
          # Python at all, and a scope resolving to nothing is a lane passing
          # over air. odoo/upgrade_code has its own step below, because mypy
          # refuses module mode and path mode in one invocation.
          python -m mypy --no-incremental --config-file mypy.ini \
            -p odoo.api -p odoo.fields -p odoo.models -p odoo._monkeypatches \
            -m odoo -m odoo.__main__ -m odoo._testing_bootstrap \
            -m odoo.exceptions -m odoo.init -m odoo.logutils -m odoo.release \
            --verbose 2>&1 | tee /tmp/mypy_core_rest.log
          set -e
          # `|| true`, NOT `|| echo 0` -- see the note on the six-package step.
          # This floor is zero, so the spelling is load-bearing on every green
          # run rather than on some future one.
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy_core_rest.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet (rest of core)
        run: |
          python tooling/ratchet/ratchet.py mypy_core_rest --count "${{ steps.mypy_core_rest.outputs.error_count }}" --json | tee /tmp/verdict_core_rest.json
          python tooling/ratchet/ratchet.py mypy_core_rest --count "${{ steps.mypy_core_rest.outputs.error_count }}"

      - name: Run mypy (odoo/upgrade_code)
        id: mypy_upgrade_code
        # AN ELEVENTH SCOPE, AND IT IS PATH MODE ON PURPOSE. The upgrade
        # scripts are named 18.5-00-domain-dynamic-dates.py and the like --
        # valid filenames, invalid module names. mypy's module mode walks a
        # package by dotted name, so `-p odoo.upgrade_code` parsed the
        # directory, NONE of the nine files in it, and reported success. Passed
        # as a path the same nine held 31 errors.
        #
        # A separate step because mypy refuses `-p` and a path together
        # ("May only specify one of: module/package, files, or command").
        #
        # A HARD ZERO WITH NO BASELINE FILE. Several of the 31 were latent crashes rather
        # than typing nits, all on inputs that parse: negating a non-numeric
        # Constant, .value on a non-Constant argument, a DictReader.fieldnames
        # of None, and data_file_module_name annotated FileManager -- which has
        # no .path -- in two scripts. tooling/typecheck/test_py_scope_coverage.py
        # holds this directory to path mode.
        run: |
          set +e
          python -m mypy --no-incremental --config-file mypy.ini \
            odoo/upgrade_code/ --verbose 2>&1 | tee /tmp/mypy_upgrade_code.log
          set -e
          # `|| true`, NOT `|| echo 0` -- see the note on the six-package step.
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy_upgrade_code.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet (odoo/upgrade_code)
        run: |
          python tooling/ratchet/ratchet.py mypy_upgrade_code --count "${{ steps.mypy_upgrade_code.outputs.error_count }}" --json | tee /tmp/verdict_upgrade_code.json
          python tooling/ratchet/ratchet.py mypy_upgrade_code --count "${{ steps.mypy_upgrade_code.outputs.error_count }}"

      - name: Enforce per-file locks
        id: scope
        # The ratchet above measures ONE integer over six packages, so a clean
        # file may regress for free whenever an unrelated file improves by the
        # same amount. This step locks the 259 files that are already clean and
        # holds the 189 exceptions to their per-file ceilings. The two are
        # complementary: the ratchet still catches aggregate drift inside the
        # exception set, and this catches every movement the total hides.
        #
        # EVERY LANE'S LOG. A SCOPED_PACKAGE checked by its own mypy run has
        # its "LOG:  Parsing" lines in that run's file, so a log omitted here
        # makes every file of its package read as `unchecked` -- the verdict
        # that exists precisely so a file nothing compiled cannot pass for a
        # file found clean. The list must therefore track SCOPED_PACKAGES:
        # tools, api, fields, models, _monkeypatches and upgrade_code joined it
        # when the scope gap was closed, and their lanes are the last three
        # files below. Each of those runs carries --verbose for this step alone;
        # it does not perturb the counts, as no verbose line matches ": error:".
        run: |
          cat /tmp/mypy.log /tmp/mypy_cli.log /tmp/mypy_tests.log \
              /tmp/mypy_tools.log /tmp/mypy_core_rest.log \
              /tmp/mypy_upgrade_code.log > /tmp/mypy_scoped.log
          python tooling/typecheck/py_scope_gate.py --log /tmp/mypy_scoped.log --check

      - name: Summarise
        if: always()
        run: |
          ERR_COUNT="${{ steps.mypy.outputs.error_count }}"
          BASELINE=$(python -c "import json;print(json.load(open('tooling/ratchet/baselines/mypy.json'))['count'])")
          {
            echo "## Python type check (mypy ratchet)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| Errors found | ${ERR_COUNT} |"
            echo "| Committed floor | ${BASELINE} |"
            echo "| Drift | $((ERR_COUNT - BASELINE)) |"
            echo ""
            if [ "${ERR_COUNT}" -gt "${BASELINE}" ]; then
              echo "> :x: Regression: lower the count or raise the floor in this PR."
            elif [ "${ERR_COUNT}" -lt "${BASELINE}" ]; then
              echo "> :arrow_down: Improvement: commit the lower floor —"
              echo "> \`python tooling/ratchet/ratchet.py mypy --count ${ERR_COUNT} --update\`"
            else
              echo "> :white_check_mark: No drift."
            fi
            echo ""
            echo "Config: \`mypy.ini\` · Floor: \`tooling/ratchet/baselines/mypy.json\` · Scope: orm, db, libs, http, service, modules"
            echo ""
            echo "\`odoo.tools\`, \`odoo.cli\` and \`odoo.tests\` are separate scopes on"
            echo "separate floors (\`mypy_tools\`, \`mypy_cli\`, \`mypy_tests\`); their counts"
            echo "are in the step logs above."
            echo ""
            echo "### Per-file locks"
            echo ""
            if [ -f /tmp/mypy_scoped.log ]; then
              python tooling/typecheck/py_scope_gate.py --log /tmp/mypy_scoped.log --markdown
            else
              echo "> Not produced — mypy did not run."
            fi
            echo ""
            echo "Locks: \`tooling/typecheck/exceptions/mypy/\` · Ceilings: \`tooling/typecheck/budgets/\`"
          } >> "$GITHUB_STEP_SUMMARY"
