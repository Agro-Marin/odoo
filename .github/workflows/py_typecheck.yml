name: Python Type Check

# Python counterpart to typecheck.yml (TypeScript). Runs mypy over the modern
# framework packages (config: mypy.ini) and enforces a DRIFT-ZERO RATCHET via
# tooling/ratchet: the committed floor is tooling/ratchet/baselines/mypy.json.
#
# This gate BLOCKS (no continue-on-error). The ratchet only moves one way:
#   * more errors than the baseline  -> fail (regression).
#   * fewer errors than the baseline -> fail too, asking you to commit the lower
#     baseline in the same PR, so every improvement is locked in and the floor
#     can never silently slip back. See tooling/ratchet/ratchet.py.
#
# To change the floor, reproduce THIS job's environment -- mypy and nothing else,
# on a clean checkout -- and commit the result. Running it in a working venv
# instead is what put the floor at 1379, a count no environment produces: with
# the project dependencies installed, mypy resolves lxml/psycopg/dateutil to real
# stubs and finds 87 MORE errors than this job does (1384 vs 1297, measured
# 2026-08-08), so a floor taken there can never be reproduced by the gate
# enforcing it, and the exact-match ratchet then fails every run.
#
#   python3 -m venv /tmp/mypyenv && /tmp/mypyenv/bin/pip install mypy==2.3.0
#   git worktree add --detach /tmp/clean HEAD   # the shared tree carries other work
#   cd /tmp/clean && /tmp/mypyenv/bin/mypy --no-incremental --config-file mypy.ini \
#     -p odoo.orm -p odoo.db -p odoo.libs -p odoo.http -p odoo.service -p odoo.modules \
#     2>&1 | tee /tmp/mypy.log
#   N=$(grep -cE ": error:" /tmp/mypy.log)
#   python tooling/ratchet/ratchet.py mypy --count "$N" --update --note '<what moved and why>'
#
# mypy is pinned in requirements-dev.txt (2.3.0), and THE FLOOR IS VERSION-
# SPECIFIC: 1.19.1 measured 1297 on the tree where 2.3.0 measures 1293. Move the
# pin and the baseline in one commit, in both this file and requirements-dev.txt.

on:
  # Mainline re-verification: re-run the ratchet on every push to a protected
  # branch so direct commits / merge-skew cannot silently drift the floor.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - 'odoo/orm/**/*.py'
      - 'odoo/db/**/*.py'
      - 'odoo/libs/**/*.py'
      - 'odoo/http/**/*.py'
      - 'odoo/service/**/*.py'
      - 'odoo/modules/**/*.py'
      - 'mypy.ini'
      - 'requirements*.txt'
      - 'tooling/ratchet/**'
      # The scope gate, its self-test, and the lists it enforces. Without this
      # a PR that only edits an exception list would not run the gate that
      # reads it — which is the one edit most likely to be wrong.
      - 'tooling/typecheck/py_scope_gate.py'
      - 'tooling/typecheck/test_py_scope_gate.py'
      - 'tooling/typecheck/exceptions/mypy/**'
      - 'tooling/typecheck/budgets/mypy-*.json'
      - '.github/workflows/py_typecheck.yml'

permissions:
  contents: read

jobs:
  mypy:
    name: mypy (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install mypy
        run: pip install "mypy==2.3.0"

      - name: Self-test the scope gate
        # Same argument as the ratchet self-test below: a checker whose own
        # logic is broken reports green over code it never read. This one
        # additionally pins the count-neutral swap that the ratchet cannot see,
        # which is the reason the scope gate exists.
        run: python tooling/typecheck/test_py_scope_gate.py

      - name: Self-test the ratchet
        # Prove the enforcement tool is sound before trusting its verdict —
        # mirrors how architecture.yml self-tests the layer checker.
        run: python tooling/ratchet/test_ratchet.py

      - name: Run mypy
        id: mypy
        # Module mode (`-p`), not path mode: passing directories makes mypy see
        # the same file under both `orm.*` and `odoo.orm.*` ("found twice").
        # mypy does static analysis only — ignore_missing_imports (mypy.ini)
        # means the heavy runtime deps (lxml, …) need NOT be installed here.
        run: |
          set +e
          # --no-incremental: the count must be deterministic for an exact-match
          # ratchet. mypy's incremental cache yields slightly different totals
          # depending on cache state; a clean run is stable.
          # --verbose is required by the scope gate, not by the ratchet: without
          # the "LOG:  Parsing <file>" lines a file mypy SKIPPED is
          # indistinguishable from a file mypy found clean, and the gate would
          # count it as locked while nothing enforces it. It does not perturb
          # the count -- verified, no verbose line matches ": error:".
          python -m mypy --no-incremental --config-file mypy.ini \
            -p odoo.orm -p odoo.db -p odoo.libs -p odoo.http -p odoo.service -p odoo.modules \
            --verbose 2>&1 | tee /tmp/mypy.log
          set -e
          # `|| true`, NOT `|| echo 0`: `grep -c` PRINTS "0" and THEN exits 1
          # when it matches nothing, so the `||` branch appends a SECOND "0"
          # and the count becomes the two-line string "0\n0", which is
          # invalid in $GITHUB_OUTPUT (one `key=value` per line). Latent only
          # while this floor is above zero -- it would break CI on precisely
          # the run that finally reached zero.
          ERR_COUNT=$(grep -cE ": error:" /tmp/mypy.log || true)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet
        id: ratchet
        # Single source of truth for the verdict; exits non-zero on any drift.
        run: |
          python tooling/ratchet/ratchet.py mypy \
            --count "${{ steps.mypy.outputs.error_count }}" --json | tee /tmp/verdict.json
          python tooling/ratchet/ratchet.py mypy --count "${{ steps.mypy.outputs.error_count }}"

      - name: Enforce per-file locks
        id: scope
        # The ratchet above measures ONE integer over six packages, so a clean
        # file may regress for free whenever an unrelated file improves by the
        # same amount. This step locks the 259 files that are already clean and
        # holds the 189 exceptions to their per-file ceilings. The two are
        # complementary: the ratchet still catches aggregate drift inside the
        # exception set, and this catches every movement the total hides.
        run: python tooling/typecheck/py_scope_gate.py --log /tmp/mypy.log --check

      - name: Summarise
        if: always()
        run: |
          ERR_COUNT="${{ steps.mypy.outputs.error_count }}"
          BASELINE=$(python -c "import json;print(json.load(open('tooling/ratchet/baselines/mypy.json'))['count'])")
          {
            echo "## Python type check (mypy ratchet)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| Errors found | ${ERR_COUNT} |"
            echo "| Committed floor | ${BASELINE} |"
            echo "| Drift | $((ERR_COUNT - BASELINE)) |"
            echo ""
            if [ "${ERR_COUNT}" -gt "${BASELINE}" ]; then
              echo "> :x: Regression: lower the count or raise the floor in this PR."
            elif [ "${ERR_COUNT}" -lt "${BASELINE}" ]; then
              echo "> :arrow_down: Improvement: commit the lower floor —"
              echo "> \`python tooling/ratchet/ratchet.py mypy --count ${ERR_COUNT} --update\`"
            else
              echo "> :white_check_mark: No drift."
            fi
            echo ""
            echo "Config: \`mypy.ini\` · Floor: \`tooling/ratchet/baselines/mypy.json\` · Scope: orm, db, libs, http, service, modules"
            echo ""
            echo "### Per-file locks"
            echo ""
            if [ -f /tmp/mypy.log ]; then
              python tooling/typecheck/py_scope_gate.py --log /tmp/mypy.log --markdown
            else
              echo "> Not produced — mypy did not run."
            fi
            echo ""
            echo "Locks: \`tooling/typecheck/exceptions/mypy/\` · Ceilings: \`tooling/typecheck/budgets/\`"
          } >> "$GITHUB_STEP_SUMMARY"
