name: ESLint Check

# Two blocking gates through tooling/ratchet: eslint over the JS, and
# `prettier --check` over the SCSS that eslint structurally cannot see.
#
# ESLint gate: a HARD ZERO. There is no tooling/ratchet/baselines/eslint.json,
# and ratchet.py holds a gate with no file at zero (tooling/ratchet/README.md),
# so any finding fails this lane. The scope is every .js/.mjs in the repository
# that eslint.config.mjs does not ignore: the fork's own addons, onboarded or
# not, the core test addons under odoo/, tooling/ and the config itself.
# Vendored code lives in <module>/static/lib by convention and is excluded
# there structurally, so there is no per-library allowlist to drift.
#
# The floor this lane used to carry (22,092 at its last bank) was measured
# 2026-09-01 and was not vendored code, tooling or a sibling checkout: 94% was
# prettier/prettier in 204 of the fork's own modules, the rest missing browser
# globals in modules never onboarded. It was formatted away in one commit
# rather than ratcheted, because a floor that only moves when the branch is
# rebased is not being driven down. To reproduce the lane locally:
#   npx eslint . --format=json --output-file=/tmp/eslint.json
#   N=$(jq '[.[].errorCount] | add // 0' /tmp/eslint.json)
#   python tooling/ratchet/ratchet.py eslint --count "$N"
#
# Audit doc: knowledge/.../2026-05-03-web-js-architecture-audit.md item #1

on:
  # Mainline re-verification: re-run the ratchet on every push to a protected
  # branch so direct commits / merge-skew cannot silently drift the floor.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.scss'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tooling/ratchet/**'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: eslint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Self-test the ratchet
        run: python tooling/ratchet/test_ratchet.py

      - name: Install committed dependencies (esbuild, typescript, eslint stack)
        # The ESLint toolchain is declared in package.json devDependencies
        # since t23543 (versions track addons/web/tooling/_package.json), so
        # a plain `npm ci` installs everything from the committed lockfile.
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          set +e
          npx eslint . --format=json --output-file=/tmp/eslint.json
          set -e
          ERR_COUNT=$(jq '[.[].errorCount] | add // 0' /tmp/eslint.json)
          WARN_COUNT=$(jq '[.[].warningCount] | add // 0' /tmp/eslint.json)
          echo "error_count=${ERR_COUNT}" >> "$GITHUB_OUTPUT"
          echo "warning_count=${WARN_COUNT}" >> "$GITHUB_OUTPUT"
          # Human-readable rerun for the log (truncated). Cached install makes it fast.
          npx eslint . --format=stylish 2>&1 | head -200 || true

      - name: Enforce ratchet
        run: |
          python tooling/ratchet/ratchet.py eslint --count "${{ steps.eslint.outputs.error_count }}" --json | tee /tmp/verdict.json
          python tooling/ratchet/ratchet.py eslint --count "${{ steps.eslint.outputs.error_count }}"

      # SCSS is the half of .prettierrc.json that eslint cannot reach: it runs
      # prettier through the prettier/prettier rule, which only ever sees JS.
      # Nothing applied the repo's own format config to .scss, so 104 files
      # drifted. Ratcheted rather than fixed in one sweep — reformatting 104
      # stylesheets at once buries every real change under whitespace.
      - name: Check SCSS formatting
        id: prettier_scss
        run: |
          set +e
          npx prettier --list-different "**/*.scss" > /tmp/prettier_scss.txt
          set -e
          COUNT=$(grep -c . /tmp/prettier_scss.txt || true)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          head -200 /tmp/prettier_scss.txt

      - name: Enforce SCSS ratchet
        run: |
          python tooling/ratchet/ratchet.py prettier_scss --count "${{ steps.prettier_scss.outputs.count }}" --json | tee /tmp/verdict_scss.json
          python tooling/ratchet/ratchet.py prettier_scss --count "${{ steps.prettier_scss.outputs.count }}"

      - name: Summarise
        if: always()
        run: |
          ERR_COUNT="${{ steps.eslint.outputs.error_count }}"
          WARN_COUNT="${{ steps.eslint.outputs.warning_count }}"
          # No baselines/eslint.json: the gate is a hard zero (tooling/ratchet/README.md).
          BASELINE=$(python -c "import json,os;p='tooling/ratchet/baselines/eslint.json';print(json.load(open(p))['count'] if os.path.exists(p) else 0)")
          {
            echo "## ESLint check (ratchet)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| Errors found | ${ERR_COUNT} |"
            echo "| Warnings found | ${WARN_COUNT} |"
            echo "| Committed floor (errors) | ${BASELINE} |"
            echo "| Drift | $((ERR_COUNT - BASELINE)) |"
            echo ""
            echo "Floor: hard zero (no \`tooling/ratchet/baselines/eslint.json\`) · Config: \`eslint.config.mjs\`"
            echo ""
            echo "## SCSS formatting (ratchet)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| Unformatted .scss files | ${{ steps.prettier_scss.outputs.count }} |"
            echo "| Committed floor | $(python -c "import json;print(json.load(open('tooling/ratchet/baselines/prettier_scss.json'))['count'])") |"
            echo ""
            echo "Floor: \`tooling/ratchet/baselines/prettier_scss.json\` · Config: \`.prettierrc.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
