name: Contract + Process Suites

# The two suites that need real external dependencies rather than a database
# full of Odoo data (see doc/coding_guidelines.rst §6.0):
#
#   * tests/contract  — compares our ASSUMPTIONS about psycopg, psql and
#     pg_dump against those programs. Every defect found in the service-layer
#     audit was an assumption mismatch, not a logic error, and each was invisible
#     to a mock-based test because the mock encoded the same wrong belief. Needs
#     a reachable PostgreSQL plus the psql/pg_dump CLIENTS.
#   * tests/process   — boots real odoo-bin processes to assert the handful of
#     properties that vanish the moment anything is mocked: a listen socket
#     surviving a re-exec, a master replacing a killed child, a bounded thread
#     pool under real half-open sockets.
#
# Neither can live in unit_tests.yml: that workflow is the database-free lane
# and must stay that way.
#
# Client version matters. pg_dump refuses to dump a server NEWER than itself,
# and `\restrict` (which the restore scanner's allowlist is pinned against)
# only appears in pg_dump 17.6+. ubuntu-latest ships an older client, so the
# PGDG repo is added to install a client matching the PostgreSQL 18 service.
#
# BLOCKING (Phase 2). Promoted from the Phase-1 warn-only rollout now that both
# suites are consistently green.
#
# The promotion was overdue in a way that had teeth: tests/contract carries the
# ONLY guard for the CREATE DATABASE sqlstate contract. PostgreSQL answers a
# *sequential* duplicate with 42P04 (DuplicateDatabase) but a *concurrent* one
# with 23505 (UniqueViolation), and the two are unrelated psycopg classes — so a
# catch written against 42P04 alone drops precisely the race it exists to
# handle. No mock can catch that: the mock is told which error to raise, so it
# encodes the same wrong belief as the code. While this workflow stayed
# advisory, that regression could return and CI would still report success.

on:
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - 'odoo/service/**'
      - 'odoo/db/**'
      - 'tests/contract/**'
      - 'tests/process/**'
      - 'tests/loading/**'
      # The loading suite characterizes this package; a change to it that
      # reordered a phase would otherwise not trigger the suite that notices.
      - 'odoo/modules/**'
      - 'requirements*.txt'
      # The @standalone runner and the one script that exercises it. Both
      # were broken at HEAD with nothing to notice.
      - 'odoo/tests/module_operations.py'
      - 'odoo/addons/base/tests/test_install.py'
      - 'odoo/addons/base/tests/test_install_addons/**'
      - '.github/workflows/service_suites.yml'

permissions:
  contents: read

jobs:
  contract-and-process:
    name: contract + process (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both suites — and the odoo-bin processes the process suite launches —
      # connect with odoo's db_host unset, i.e. through libpq's own defaults.
      # These are what point that at the service container.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: odoo
      PGPASSWORD: odoo
      # A skip-guarded suite that silently skips reports green while comparing
      # nothing. This turns a missing dependency into a FAILURE here, while
      # leaving it a skip on a developer's machine.
      ODOO_CONTRACT_REQUIRE_DEPS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build + install the odoo_rust extension
        # `import odoo` pulls it in transitively; both suites import odoo.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.0,<2.0'
          maturin build --release --manifest-path crates/odoo_rust/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist odoo_rust

      - name: Install PostgreSQL 18 client tools
        # psql and pg_dump are the programs under test in tests/contract, so
        # they must match the server: an older pg_dump refuses a newer server
        # outright, and only 17.6+ emits the \restrict wrapper the scanner's
        # allowlist is pinned against.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version && psql --version

      - name: Install system + Python dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev libcairo2-dev
          pip install --quiet -r requirements-test.txt

      - name: Contract suite (psycopg / psql / pg_dump)
        run: python -m pytest tests/contract -q

      - name: Process suite (real odoo-bin processes)
        # Separate step so a failure is attributable: the contract suite
        # compares programs, this one supervises processes.
        run: python -m pytest tests/process -q

      - name: Loading suite (module loader against a real database)
        # The third real-dependency suite: characterization of
        # odoo/modules/loading.py::load_modules — the densest function in the
        # core (332 lines, 70 branches) and the one the monolith decomposition
        # never reached. It installs `base` into a disposable database and
        # asserts the ORDER of the phases, plus the uninstall branch, which no
        # other suite drives at all.
        #
        # Separate step for the same reason as above, and because it is the
        # slowest of the three (a real `-i base` per session).
        run: python -m pytest tests/loading -q

      - name: Standalone scripts (module-install isolation)
        # `@standalone` scripts run through `odoo-bin`'s own runner, never
        # through pytest or `--test-enable`, so nothing in CI ran them and the
        # runner was broken at HEAD without anyone noticing:
        # `odoo/tests/module_operations.py` called
        # `odoo.service.db._check_faketime_mode`, a name that package does not
        # export, so every invocation died on an AttributeError.
        #
        # `base/tests/test_install.py` is the script that matters here. It
        # installs a module whose data file fails to parse and asserts the two
        # modules installed just before it survive intact — the one check that
        # module installation is isolated per module. It needs its three fixture
        # addons on the addons path, which is why no ordinary integration lane
        # picks it up.
        #
        # The database must be created but must NOT have the fixture modules
        # installed: the script skips (and now says so, rather than failing)
        # when they already are.
        run: |
          python odoo-bin -d standalone_ci --addons-path=odoo/addons,addons,odoo/addons/base/tests/test_install_addons \
            -i base --without-demo=all --stop-after-init --no-http
          python -m odoo.tests.module_operations \
            --database standalone_ci \
            --addons-path=odoo/addons,addons,odoo/addons/base/tests/test_install_addons \
            standalone test_isolated_install
