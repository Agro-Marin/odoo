name: Integration Tests (DB-backed)

# THE missing gate. Before this, no workflow ran a single TransactionCase or
# HttpCase: only the DB-free unit tiers (unit_tests.yml) executed in CI, so a
# regression anywhere in odoo/orm/runtime, odoo/orm/models, odoo/modules or
# odoo/http could merge green. This lane boots a real PostgreSQL 18, installs
# the framework, and runs the `base` module's test suite against it.
#
# Scope: a framework SMOKE, not the whole suite — `base` exercises the ORM
# (registry, environment, fields, domains), module loading and access rules
# end-to-end against real SQL. It is the highest-value-per-minute coverage of
# the decomposed core. Broaden via the TEST_TAGS / INSTALL env below
# (e.g. add `test_orm`, `test_http`) once this is stable and timing is known.
#
# Why template0 + C collation: Odoo creates its database with
# `ENCODING 'unicode' LC_COLLATE 'C'` only when db_template is template0
# (odoo/service/db.py). PostgreSQL 18's default template1 locale would
# otherwise take the non-C path and give non-deterministic ordering. So we
# pass --db-template=template0 and let Odoo create the DB itself.

on:
  # Mainline re-verification: boot PG18 and run the base smoke on every push to a
  # protected branch, so a behavioural regression cannot land via a direct commit
  # or merge-skew without CI catching it post-merge.
  push:
    branches: ['19.0-marin', '19.0']
  pull_request:
    branches: ['*']
    paths:
      - 'odoo/orm/**'
      - 'odoo/db/**'
      - 'odoo/http/**'
      - 'odoo/service/**'
      - 'odoo/modules/**'
      - 'odoo/fields/**'
      - 'odoo/models/**'
      - 'odoo/api/**'
      # tools/ (18k lines) and libs/ (14k) were omitted until 2026-08-08, so a
      # third of the core could change without any DB-backed test running. The
      # duplicated `image_process` whose annotations had silently drifted to
      # describe a call that raises TypeError lived in exactly that blind spot.
      - 'odoo/tools/**'
      - 'odoo/libs/**'
      - 'odoo/addons/base/**'
      - 'odoo/addons/test_orm/**'
      # The mrp lane below. Without this an mrp-only pull request triggered no
      # DB-backed workflow at all — `addons/**` appeared nowhere in this filter.
      - 'addons/mrp/**'
      - 'addons/stock/**'
      # The certificate lane below, for the same reason the two above are listed:
      # without it a certificate-only pull request triggers no DB-backed workflow.
      - 'addons/certificate/**'
      # The rpc lane below. `rpc` lives in odoo/addons, not addons/, so it was
      # not covered by any entry here either.
      - 'odoo/addons/rpc/**'
      # The crm lane below. crm was installed by exactly one workflow --
      # module_installability.yml, which passes no --test-enable -- so its 142
      # tests and its six assertQueryCount pins were executed by nothing. That
      # is how the pins came to sit 24-58% over the tree they measure.
      - 'addons/crm/**'
      - 'addons/sales_team/**'
      # The document_extract lane below. The framework and its five bundled
      # consumers were installed by module_installability.yml alone, which
      # passes no --test-enable, so 171 tests ran in no lane at all. One glob
      # rather than six entries, because the family grows by adding a consumer
      # and a list that has to be extended by hand is a list that will not be.
      - 'addons/document_extract*/**'
      # The base_order lane below, and both halves of it: the mixins and the
      # module whose only purpose is to exercise them.
      - 'addons/base_order/**'
      - 'addons/test_base_order/**'
      # The approval lane below. 545 test methods, and `automation` is listed
      # with it because approval builds its workflows on automation's runtime --
      # a change there reaches approval's suite and no other.
      - 'addons/approval/**'
      - 'addons/automation/**'
      # The api_ai / project_hr / mixin_encryption lane below. `credential` and
      # `api_transport` are listed because api_ai is installed on top of them
      # and mixin_encryption is what they store secrets through -- a change
      # there reaches this lane even though neither module's own suite runs.
      - 'addons/api_ai/**'
      - 'addons/api_transport/**'
      - 'addons/credential/**'
      - 'addons/mixin_encryption/**'
      - 'addons/project_hr/**'
      # Also in that lane, and found by the gate rather than by hand: see the
      # env block below for why a census keyed on the manifest's author missed
      # all four.
      - 'addons/date_range/**'
      - 'addons/test_date_range/**'
      - 'addons/account_coa/**'
      - 'odoo/addons/test_performance_compare/**'
      - 'crates/**'
      - 'requirements*.txt'
      - '.github/workflows/integration_tests.yml'

permissions:
  contents: read

env:
  INSTALL: base
  # The base suite. The genuine fork-bug failures (stale tests left behind by the
  # db/ decomposition) were fixed at the root, not excluded — see 162cea6
  # (TestConfigManager pool options, TestCopyFromMetricsQueryLazy hooks kwarg,
  # TestProfiling metrics.py frame).
  #
  # Two classes remain excluded for non-code reasons (documented, not silent):
  #   * TestReportsRendering — exercises PDF rendering via wkhtmltopdf, which this
  #     fork has DROPPED. The tests are obsolete; TODO remove them outright rather
  #     than carry the exclusion.
  #   * TestIrModelFieldsTranslation — a browser tour; deferred pending a
  #     confirmed headless-browser setup in CI (web auto-installs with base, so it
  #     should run once the runner has Chrome). Re-include after the first green run.
  TEST_TAGS: /base,-:TestReportsRendering,-:TestIrModelFieldsTranslation
  # Floor for the count gate below: a run reporting fewer than this skipped
  # rather than failed. Raise it deliberately when the scope grows.
  TEST_COUNT_FLOOR: 2500

  # test_http runs as a SECOND suite against its OWN database, not alongside
  # base in one. That is not tidiness -- the suites interfere. test_http depends
  # on mail, and mail/views/res_partner_views.xml inherits
  # base.view_res_partner_filter with `<filter name="inactive" position="after">`.
  # base's TestViewArchRecovery.test_hard_reset_from_file_still_works overwrites
  # that very view with a minimal `<search>`, and the write re-validates the
  # children, so mail's spec can no longer find the filter it anchors to:
  #
  #   -i base                 -> 5/5 green
  #   -i base,test_http       -> ValidationError, running ONLY that test class
  #
  # The base test is fragile by construction (it mutates a shared core view, so
  # it passes only while nothing inherits it), and a shared database makes every
  # future addon added here a chance to trip it. Separate databases make the
  # suites independent instead of making one of them someone else's problem.
  #
  # test_http itself ran in NO workflow until 2026-08, and the cost was three
  # defects: test05_session_save_logs_on_failure committed red two months
  # earlier; MemorySessionStore missing the `_remove_sid` that the `rotate` it
  # borrows from FilesystemSessionStore calls, so /web/session/logout 500'd in
  # five tests; and 4ffeacacd8c stripping `_http_handler`'s docstring, which
  # `openapi._summary()` reads as fixture data. All three are the same failure:
  # a suite nothing ran. When you add a test addon, give it a lane here.
  #
  # IT RAN WITH `--no-http` UNTIL 2026-08-30, WHICH IS THE SAME FAILURE AGAIN,
  # one layer in. Every HttpCase in the module skips itself without a server
  # ("requires a running HTTP server"), and a skipped setUpClass takes its whole
  # class with it: the lane reported `0 failed, 0 error(s) of 25 tests` and was
  # read as green while 35 classes never started. With the server up the same
  # command measures 255 tests, 0 skipped — so this lane was exercising under a
  # tenth of the suite, and none of the end-to-end request path it exists for.
  # None of the 35 needs Chrome; they use `url_open`, not `browser_js`.
  HTTP_INSTALL: test_http
  HTTP_TEST_TAGS: /test_http
  # Deliberately well under the 255 that run, so a collection or tag change
  # fails loudly rather than by one test. The floor is what makes the skip
  # above impossible to reintroduce quietly.
  HTTP_TEST_COUNT_FLOOR: 200

  # test_orm, added 2026-08-08 — the broadening this workflow's header has asked
  # for since it landed ("Broaden via the TEST_TAGS / INSTALL env below (e.g. add
  # test_orm, test_http) once this is stable and timing is known").
  #
  # It is the largest thing that was dark: 1,104 test methods over 26,467 lines,
  # and it is the addon written to test the ORM. Most of what it covers is
  # reachable by no other lane -- above all
  # test_domain_evaluator_parity.py, the ONLY check that a Domain means the same
  # to both of its consumers, `search()` (SQL) and `filtered_domain()` (the
  # in-memory predicate). That file carries a generative suite which builds
  # random domains and asserts the two evaluators agree or both refuse, plus a
  # partition check on D vs ~D. No DB-free tier can see a SQL/predicate
  # divergence; only this can, and until now nothing ran it.
  #
  # Its own database and its own suite, for the reason spelled out above for
  # test_http: these suites interfere when installed together.
  ORM_INSTALL: test_orm
  ORM_TEST_TAGS: /test_orm

  # mrp, added 2026-08-09 — the first *business* addon to get a lane, and it is
  # here for the same reason test_http was: a suite nothing ran.
  #
  # 398 TransactionCases over 26k lines executed in no workflow. The cost is
  # already on the books: 3bcf5d144f9 deleted `stock.move.availability` on the
  # finding that it had "no consumer anywhere in the workspace", and the sweep
  # missed addons/mrp/tests/test_order.py, which asserted on it. That test had
  # been erroring ever since -- every assertion after the failing line, the
  # rounding behaviour it exists to guard, silently unexecuted. Nothing noticed,
  # because nothing ran it.
  #
  # mrp is also the deepest ORM consumer among the bundled addons -- recursive
  # BoM explosion, backorder splitting, multi-level procurement, compute chains
  # across four models -- so it exercises the core in ways `base` cannot.
  #
  # Its own database, same reasoning as test_http and test_orm above.
  MRP_INSTALL: mrp
  MRP_TEST_TAGS: /mrp

  # `certificate` owns X.509 parsing, private-key loading and the signing API for
  # every consumer that needs one -- l10n_mx_edi, l10n_cl_edi, l10n_ec_edi,
  # l10n_pe_edi, sign, account_edi_proxy_client and eleven more. Its suite ran in
  # no lane at all: it is not in the four above, and `module_installability.yml`
  # asks only whether the graph still assembles.
  #
  # That is a poor place to have no coverage. The failures this catches are not
  # ordinary regressions -- a certificate that stops parsing, or a key that signs
  # with the wrong digest, breaks fiscal document submission in whichever country
  # is downstream, and does it silently until a tax authority refuses the file.
  #
  # Cheap: 43 post-install tests in 13s on a fresh database, measured.
  CERTIFICATE_INSTALL: certificate
  CERTIFICATE_TEST_TAGS: /certificate

  # stock, added 2026-08-22 — the same hole as mrp's, one layer down. `mrp`
  # installs stock and exercises it as a consumer, but selects `/mrp`, so no
  # workflow has ever run a single one of stock's own 1337 tests. The cost is
  # on the books here too: e46c890c065 landed test_orderpoint_audit.py with two
  # tests that could not pass in a stock-only registry -- they searched for a
  # `buy` rule, an action `purchase_stock` adds to the selection, got an empty
  # recordset, and asserted on behaviour that lives in an override stock does
  # not carry. They were red from the commit that added them and stayed red,
  # because nothing ran them.
  #
  # stock sits under mrp, purchase_stock, sale_stock, point_of_sale and the
  # whole delivery ring, so its own suite is the cheapest place to catch a
  # regression that would otherwise surface as a failure in a dependent module.
  #
  # Its own database, same reasoning as the three suites above.
  STOCK_INSTALL: stock
  # The 8 HttpCase tours are excluded rather than skipped silently: `--no-http`
  # below turns each into a success that never ran, and the count gate cannot
  # tell that apart from a narrowed tag. They are the same deferral as base's
  # TestIrModelFieldsTranslation -- re-include both once the runner has a
  # confirmed headless Chrome, at which point the floor moves to 1345.
  STOCK_TEST_TAGS: /stock,-:TestStockPickingTour,-:TestStockReportTour

  # rpc, added 2026-08-27 -- the module that owns /xmlrpc, /xmlrpc/2, /jsonrpc
  # and /json/2, i.e. every way into this server that is not the web client.
  # The word `rpc` appeared in no workflow in this directory: it is in none of
  # the lanes above, `module_installability.yml` asks only whether the graph
  # assembles, and `test_http` installs rpc as a dependency but selects
  # `/test_http`. So its suite ran nowhere.
  #
  # What that cost, found in one audit of the module: the argument pre-flights
  # in `tools/preflight.py` read the sort argument as `kwargs["order"]` alone,
  # so every POSITIONAL order -- args[3] of `search`, args[4] of `search_read`,
  # args[6] of `formatted_read_group` -- and `read_group`'s `orderby` in BOTH
  # forms went unchecked, while the keyword spelling of the same call was
  # refused. `formatted_read_group`'s `having` and `export_data`'s field list
  # were read by nothing at all. Each is a check a caller steps around by
  # moving an argument, and each has a test now -- tests that this lane is what
  # makes binding.
  #
  # Runs WITH the HTTP server, unlike every lane above. rpc's three HttpCase
  # classes drive real XML-RPC and /json/2 requests through `url_open` and
  # `ServerProxy`; none of them is a tour and none needs a browser, so there is
  # nothing here for `--no-http` to protect against and 25 of the 106 tests --
  # the only end-to-end coverage of the wire format -- are what it would skip.
  # Verified: the suite passes headless.
  # hr_holidays, added 2026-08-30 -- the Time Off application, named in NO
  # workflow in this directory. Not in a lane here, and `module_installability.yml`
  # passes no --test-enable, so 310 tests ran nowhere and the whole module was
  # graded on whether its graph assembles.
  #
  # What that cost, found in one audit: `hr.leave.report`'s two UNION branches
  # listed leave_id/allocation_id in opposite order, and UNION ALL binds by
  # POSITION -- so every leave row filed its id under allocation_id and clicking
  # a row in "Time Off by Type" opened an unrelated allocation. `hr.leave.write`
  # re-ran the allocation balance check from a hand-written field list that named
  # request_date_from twice and request_date_to never, so an employee could
  # overdraw an allocation by dragging the END of a request. `hr.leave.type`
  # looked its balance up by NAME, so two types sharing one (one per company is
  # the ordinary case) reported the same figure in the request dropdown.
  # None of the three could ever have been caught here.
  #
  # `-i hr_holidays` pulls hr, calendar, mail and resource; the tests are its own.
  #
  # Runs under --no-http like the lanes above, which SKIPS the tour classes and
  # reports them as skipped rather than as passes, so the count is 310 rather
  # than 334 and the floor sits under it. One of those tours,
  # TestHolidaysCalendar.test_hours_time_off_request_calendar_view, is red on
  # this branch independently of this lane (CLAUDE.md section 4) -- fix it before
  # dropping --no-http, or the lane goes red on a defect it did not introduce.
  # hr_work_entry + hr_work_entry_holidays, added 2026-08-30 -- the same hole as
  # hr_holidays below, found by asking the same question of a sibling module:
  # `grep -rln hr_work_entry .github/workflows/` returns nothing. No lane here,
  # and module_installability.yml passes --test-enable only for
  # '/test_lint:TestBundlesAssemble', so it grades graph assembly. 71 tests ran
  # nowhere.
  #
  # What that cost, each live on this branch and catchable by no existing lane:
  # a validated ("In Payslip") work entry silently demoted to draft, so adding
  # an entry to a day and removing it again destroyed an unrelated entry's
  # payroll validation with no error and no log; create() not keeping state and
  # active in step the way write() did, so a cancelled entry stayed active and
  # kept feeding the SQL 24h cap and raising phantom conflicts on its
  # neighbours; amount_rate landing at 0.0 whenever the work entry type came
  # from the field default, which is what the calendar UI does, so a pay rate
  # silently became zero; get_unusual_days being @api.model, so self.company_id
  # was empty and the company domain was dropped entirely; and HR officers being
  # unable to delete a work entry while the calendar offers deletion to exactly
  # that group.
  #
  # The pair installs together because both live in odoo/addons; the three
  # enterprise bridges cannot be in this lane. Neither module has a tour, so
  # unlike hr_holidays below the --no-http run IS the whole suite.
  HR_WORK_ENTRY_INSTALL: hr_work_entry,hr_work_entry_holidays
  HR_WORK_ENTRY_TEST_TAGS: /hr_work_entry,/hr_work_entry_holidays

  HR_HOLIDAYS_INSTALL: hr_holidays
  HR_HOLIDAYS_TEST_TAGS: /hr_holidays

  RPC_INSTALL: rpc
  RPC_TEST_TAGS: /rpc

  # data_recycle, added 2026-08-28 -- the module whose cron archives and deletes
  # other modules' records, and which appeared in no lane of this file. Its suite
  # ran only when someone ran it by hand, which is how it came to ship a queue
  # that acted on records after their rule had stopped selecting them, a rule
  # with no filter that emptied the whole table, and a cron that ended its night
  # on the first record a foreign key protected.
  #
  # `-i data_recycle` pulls mail and the rest of its graph; the tests are its own.
  #
  # Two of the 29 are tours and need headless Chrome, which this runner does not
  # have confirmed -- the same deferral as stock's two tour classes. `--no-http`
  # below skips their class and REPORTS it as skipped rather than as a pass, so
  # the count is 27 and the floor sits under it. Drop `--no-http` once Chrome is
  # confirmed, at which point the count is 29 and the floor moves to 27.
  RECYCLE_INSTALL: data_recycle
  RECYCLE_TEST_TAGS: /data_recycle

  # crm, added 2026-08-28 -- the module whose suite no lane ran.
  #
  # It was installed by exactly one workflow, module_installability.yml, which
  # asks only whether the graph assembles and passes no --test-enable. So 142
  # tests and six assertQueryCount pins were executed by nothing, which is how
  # the pins came to sit 24-58% over the tree they measure and how a third of
  # the HOOT suite stayed red without anyone being told.
  #
  # `-i crm` is the whole install set: crm's own tests are the scope and every
  # dependency comes with it. It is not the widest useful shape -- six
  # enterprise bridges auto-install over crm and are not in this repository --
  # but the six query pins are set to the maximum of the three shapes measured
  # (no demo, --with-demo, plus those bridges), so a community-only lane cannot
  # pass a pin that the enterprise shape would fail.
  #
  # No tag exclusions. The two HttpCase classes, TestUi in test_crm_ui and in
  # test_sales_team_ui, skip themselves under --no-http and are reported as
  # skipped rather than as passes, so the floor below sits under the 142.
  CRM_INSTALL: crm
  CRM_TEST_TAGS: /crm

  # mixin_report_sql, added 2026-08-28 -- another suite nothing ran, found by
  # auditing the module rather than by a failure. It shipped 30 tests and no
  # lane executed one of them: not integration_tests (its tags name /base,
  # /test_http, /test_orm, /mrp, /certificate, /stock and /rpc), not
  # module_installability (which enables only /test_lint:TestBundlesAssemble),
  # and not pytest (its cases are TransactionCase, and testpaths holds the
  # DB-free leaf suites).
  #
  # What the dark suite cost, all five found in one audit and all invisible to
  # a green run of those 30 tests: a stand-alone materialized view the ORM
  # never read; a rolling refresh with no SAVEPOINT, so a failure left the
  # cursor aborted and ir.cron could not even record it; a rolling report that
  # needed mixin.sql.report, did not say so, and failed on the *second* tick;
  # a SQL table expression plus an alias rendering `(...) x a`, which
  # PostgreSQL rejects; and a materialized view whose unique index was on some
  # other column, leaving `id` -- what every ORM read filters on -- unindexed.
  #
  # The suite now runs against concrete fixture models rather than patched
  # abstract mixins, which is what makes those reachable at all.
  #
  # Its own database, same reasoning as the suites above. mixin_report_sql
  # depends on base alone, so this is the cheapest lane here.
  SQL_REPORT_INSTALL: mixin_report_sql
  SQL_REPORT_TEST_TAGS: /mixin_report_sql

  # `test_read_group` is the only coverage of the five read_group/ units --
  # _empty, fill, format, mixin and sql -- and gates.md has named it as the next
  # suite worth taking since the lane was built. 123 test methods, none of them
  # reachable by either DB-free tier: a read_group is a GROUP BY, and what it
  # groups is decided by SQL the in-memory path never runs.
  READ_GROUP_INSTALL: test_read_group
  READ_GROUP_TEST_TAGS: /test_read_group

  # `test_access_rights` is record rules and ACLs, which is the one subsystem
  # where a wrong answer is a security answer rather than a broken one. 52
  # tests, one of which skips for want of an HTTP server, so the floor below
  # sits under that.
  ACCESS_RIGHTS_INSTALL: test_access_rights
  ACCESS_RIGHTS_TEST_TAGS: /test_access_rights

  # `document_extract` is a framework with consumers, and the consumers are the
  # only thing that tells it whether a change to the schema still means what it
  # meant. A declaration that a list field states its row shape passed the
  # framework's own 113 tests and deleted every skill a CV named as a bare
  # string, because `document_extract_hr_recruitment_skills` is a separate
  # module and was in nobody's test-tags. Naming all six is the point of the
  # lane; `--test-tags` matches a module name exactly, so
  # `/document_extract_hr_recruitment` does not reach `..._skills`.
  #
  # Six here and not the whole family: `document_extract_ai` lives in agromarin
  # and `document_extract_account_bank_statement` in enterprise, neither of
  # which this checkout can see, and `document_extract_barcode` and
  # `document_extract_ocr` declare external dependencies (zxing-cpp, rapidocr,
  # onnxruntime) that requirements-addons.txt does not carry.
  DOCEXT_ACCOUNT_INSTALL: document_extract_account_purchase
  DOCEXT_ACCOUNT_TEST_TAGS: /document_extract,/document_extract_account,/document_extract_account_purchase
  DOCEXT_RECRUIT_INSTALL: document_extract_hr_recruitment_skills
  DOCEXT_RECRUIT_TEST_TAGS: /document_extract_hr_recruitment,/document_extract_hr_recruitment_skills
  DOCEXT_EXPENSE_INSTALL: document_extract_hr_expense
  DOCEXT_EXPENSE_TEST_TAGS: /document_extract_hr_expense

  # `test_base_order` is `category: Hidden/Tests` -- a module whose entire
  # purpose is to exercise `base_order`'s mixins against concrete models, 219
  # test methods of it, and no workflow named it. A test-only module that
  # nothing runs is not covered by being installable.
  #
  # `sale` and `purchase` are installed with it and are not optional. The
  # manifest depends on `base_order` alone, but the tests reach past it: they
  # assert over ORDER_MODELS = [sale.order, purchase.order, base.order.test] and
  # read `order_lock_so`, which `sale` declares. Installed alone the suite
  # reports 67 errors, every one of them a KeyError for a model or a field that
  # is simply not in the registry -- a scope artefact that reads exactly like a
  # broken module. With them: 281 tests, 0 failed.
  #
  # `/base_order` rides along because the mixins' own suite is in the same
  # position and needs the same registry.
  BASE_ORDER_INSTALL: test_base_order
  BASE_ORDER_TEST_TAGS: /test_base_order,/base_order

  # `approval` is the largest suite this fork owns that no lane ran: 545 test
  # methods over approval rules, workflow steps, delegation, cancellation and
  # multi-company isolation, reached until now only by
  # module_installability.yml. It passes -- 544 tests, one skipped for want of
  # something the environment cannot provide -- so this lane is not a repair.
  #
  # The scope is the module's own machine_doc_v1/conventions.md, which states
  # `-i approval --test-tags '/approval'` and is right: unlike base_order,
  # approval's tests reach nothing past its own depends.
  APPROVAL_INSTALL: approval
  APPROVAL_TEST_TAGS: /approval

  # The last three fork-native suites that ran nowhere, in one lane because
  # none is large enough to be worth its own database: api_ai (231),
  # project_hr (35), mixin_encryption (20).
  #
  # Installing api_ai installs `api_transport` and `credential`, whose own
  # suites stay unrun by the decision in CLAUDE.md 9.6. That is the point of
  # naming modules in `--test-tags` rather than counting what a lane installs:
  # this lane holds api_ai to its tests without touching that decision.
  # Four more the gate named that a hand census had not. The census filtered on
  # `"author": "AgroMarin"` as an exact string, and these declare it alongside
  # others -- "Odoo S.A., AgroMarin", "ACSONE SA/NV, Odoo Community Association
  # (OCA), AgroMarin". That is the second way the author heuristic failed in one
  # day; the first was `base_order`, which says "Odoo Community" and names
  # AgroMarin nowhere. Author-based scoping was rejected for exactly this,
  # and `module_suite_lane` finds them because it asks whether a lane names a
  # module rather than whether the module is ours. 68 tests, all passing.
  API_AI_INSTALL: api_ai
  API_AI_TEST_TAGS: /api_ai
  PROJECT_HR_INSTALL: project_hr
  PROJECT_HR_TEST_TAGS: /project_hr
  EXCHANGE_INSTALL: exchange
  EXCHANGE_TEST_TAGS: /exchange,/mixin_encryption
  DATE_RANGE_INSTALL: test_date_range
  DATE_RANGE_TEST_TAGS: /date_range,/test_date_range
  ACCOUNT_COA_INSTALL: account_coa
  ACCOUNT_COA_TEST_TAGS: /account_coa
  PERF_COMPARE_INSTALL: test_performance_compare
  PERF_COMPARE_TEST_TAGS: /test_performance_compare

jobs:
  base-smoke:
    name: base suite (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait until PG accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build + install the odoo_rust extension
        # The ORM hot paths (_field_access) hard-import odoo_rust — no fallback.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.0,<2.0'
          maturin build --release --manifest-path crates/odoo_rust/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist odoo_rust

      - name: Install system + Python dependencies
        run: |
          sudo apt-get update
          # lxml / Pillow / python-ldap build deps; most wheels are prebuilt but
          # these cover the source-build fallbacks.
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev libcairo2-dev
          pip install --quiet -r requirements-test.txt

      - name: Run base test suite
        # odoo-bin exits non-zero when any test fails (cli/server.py propagates
        # the assertion report's result as the process exit code), so this step
        # fails the job on a single test failure.
        #
        # The exit code does NOT cover tests that never ran. A skipped
        # setUpClass logs at INFO and counts as success: `--no-http` below
        # turns every HttpCase into one ("requires a running HTTP server"),
        # which is 22 tests across 12 classes in `base` today — small, but the
        # same blindness hides a mass-skip from a narrowed tag, a module that
        # failed to install, or a broadened `--no-http`. So the log is kept and
        # the next step gates on the test COUNT as well as the exit code.
        run: |
          set -o pipefail
          python odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_smoke \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --db-template=template0 \
            -i "${INSTALL}" \
            --test-enable --test-tags "${TEST_TAGS}" \
            --stop-after-init \
            --max-cron-threads=0 --no-http \
            --log-level=test --logfile=/dev/stdout 2>&1 | tee /tmp/base-suite.log

      - name: Assert the suite actually ran
        # `N failed, M error(s) of X tests` (odoo/tests/result.py:215). A run
        # that reports success having executed nothing looks identical to a
        # clean run in the exit code alone.
        run: |
          RAN=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' /tmp/base-suite.log \
                | tail -1 | grep -oE 'of [0-9]+ tests' | grep -oE '[0-9]+')
          if [ -z "$RAN" ]; then
            echo "::error::no test-result summary in the log — the suite did not report a count"
            exit 1
          fi
          echo "tests run: $RAN (floor: ${TEST_COUNT_FLOOR})"
          if [ "$RAN" -lt "${TEST_COUNT_FLOOR}" ]; then
            echo "::error::only $RAN tests ran, below the floor of ${TEST_COUNT_FLOOR} —"
            echo "::error::something was skipped rather than failed. Raise the floor"
            echo "::error::deliberately if the scope legitimately shrank."
            exit 1
          fi

      - name: Run test_http suite
        # Its own database (ci_http), for the view-inheritance reason recorded
        # in the env block above. Same interpreter and dependencies as the step
        # before it -- only the database and the module set differ.
        run: |
          set -o pipefail
          python odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_http \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --db-template=template0 \
            -i "${HTTP_INSTALL}" \
            --test-enable --test-tags "${HTTP_TEST_TAGS}" \
            --stop-after-init \
            --max-cron-threads=0 \
            --log-level=test --logfile=/dev/stdout | tee /tmp/http-suite.log

      - name: Assert the test_http suite actually ran
        # The guard base and test_orm already carry, and the one this suite
        # needed most: it was the only core lane without a count, and what it
        # was hiding was 35 classes skipping themselves for want of a server.
        # An exit code cannot tell a clean run from one that executed nothing.
        run: |
          RAN=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' /tmp/http-suite.log \
                | tail -1 | grep -oE 'of [0-9]+ tests' | grep -oE '[0-9]+')
          if [ -z "$RAN" ]; then
            echo "::error::no test-result summary in the log — test_http did not report a count"
            exit 1
          fi
          echo "test_http tests run: $RAN (floor: ${HTTP_TEST_COUNT_FLOOR})"
          if [ "$RAN" -lt "${HTTP_TEST_COUNT_FLOOR}" ]; then
            echo "::error::only $RAN test_http tests ran, below the floor of"
            echo "::error::${HTTP_TEST_COUNT_FLOOR} — something skipped rather than failed."
            echo "::error::A drop to ~25 means the HttpCases found no server."
            exit 1
          fi

      - name: Run test_orm suite
        # Its own database (ci_orm), same reasoning as test_http above.
        # Tee'd to a log because the count assertion below needs it: `set -o
        # pipefail` so a suite failure is not swallowed by the pipe.
        run: |
          set -o pipefail
          python odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_orm \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --db-template=template0 \
            -i "${ORM_INSTALL}" \
            --test-enable --test-tags "${ORM_TEST_TAGS}" \
            --stop-after-init \
            --max-cron-threads=0 --no-http \
            --log-level=test --logfile=/dev/stdout | tee /tmp/orm-suite.log

      - name: Assert the test_orm suite actually ran
        # Same guard as the base suite: an exit code alone cannot distinguish a
        # clean run from one that executed nothing, and this suite exists
        # precisely because "a suite nothing ran" has cost this fork before.
        # Floor deliberately well under the 1,104 methods collected, since a
        # tag/collection change should fail loudly rather than by one test.
        run: |
          RAN=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' /tmp/orm-suite.log \
                | tail -1 | grep -oE 'of [0-9]+ tests' | grep -oE '[0-9]+')
          if [ -z "$RAN" ]; then
            echo "::error::no test-result summary in the log — test_orm did not report a count"
            exit 1
          fi
          echo "test_orm tests run: $RAN (floor: 900)"
          if [ "$RAN" -lt 900 ]; then
            echo "::error::only $RAN test_orm tests ran, below the floor of 900 —"
            echo "::error::something was skipped rather than failed."
            exit 1
          fi

      - name: Run mrp suite
        # Its own database (ci_mrp), same reasoning as test_http and test_orm.
        # `mrp` pulls in stock, product, uom and resource, so this lane also
        # gives those their first DB-backed exercise through a real consumer.
        run: |
          set -o pipefail
          python odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_mrp \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --db-template=template0 \
            -i "${MRP_INSTALL}" \
            --test-enable --test-tags "${MRP_TEST_TAGS}" \
            --stop-after-init \
            --max-cron-threads=0 --no-http \
            --log-level=test --logfile=/dev/stdout | tee /tmp/mrp-suite.log

      - name: Assert the mrp suite actually ran
        # Same guard as the two suites above. 398 tests today; the floor sits
        # well under it so that a narrowed tag or a module that failed to
        # install fails loudly, rather than a single deleted test doing it.
        run: |
          RAN=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' /tmp/mrp-suite.log \
                | tail -1 | grep -oE 'of [0-9]+ tests' | grep -oE '[0-9]+')
          if [ -z "$RAN" ]; then
            echo "::error::no test-result summary in the log — mrp did not report a count"
            exit 1
          fi
          echo "mrp tests run: $RAN (floor: 350)"
          if [ "$RAN" -lt 350 ]; then
            echo "::error::only $RAN mrp tests ran, below the floor of 350 —"
            echo "::error::something was skipped rather than failed."
            exit 1
          fi

      - name: Run certificate suite
        # Its own database, same reasoning as the three suites above.
        run: |
          set -o pipefail
          python odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_certificate \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --db-template=template0 \
            -i "${CERTIFICATE_INSTALL}" \
            --test-enable --test-tags "${CERTIFICATE_TEST_TAGS}" \
            --stop-after-init \
            --max-cron-threads=0 --no-http \
            --log-level=test --logfile=/dev/stdout | tee /tmp/certificate-suite.log

      - name: Assert the certificate suite actually ran
        # Same guard as the three suites above. 43 tests today; the floor sits well
