        run: |
          RAN=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' /tmp/certificate-suite.log \
                | tail -1 | grep -oE 'of [0-9]+ tests' | grep -oE '[0-9]+')
          if [ -z "$RAN" ]; then
            echo "::error::no test-result summary in the log — certificate did not report a count"
            exit 1
          fi
          echo "certificate tests run: $RAN (floor: 35)"
          if [ "$RAN" -lt 35 ]; then
            echo "::error::only $RAN certificate tests ran, below the floor of 35 —"
            echo "::error::something was skipped rather than failed."
            exit 1
