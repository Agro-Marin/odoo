      - name: Run stock suite
        # Its own database (ci_stock), same reasoning as the three above.
        # It runs after mrp only because the steps are appended in the order the
        # lanes were added; the two are independent. When both go red the stock
        # line is the one that names the defect -- mrp installs stock, so a stock
        # regression reaches mrp as collateral.
        run: |
          set -o pipefail
          python odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_stock \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
