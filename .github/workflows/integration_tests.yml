        # sits above what a --no-http run reports (82), so that regression fails
        # here rather than passing quietly.
        run: |
          RAN=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' /tmp/rpc-suite.log \
                | tail -1 | grep -oE 'of [0-9]+ tests' | grep -oE '[0-9]+')
