[package]
name = "odoo_lint"
version = "0.1.0"
edition = "2024"
description = "Parallel source scanning for the test_lint gates"

[lib]
name = "odoo_lint"
# rlib so `cargo test` can build a test binary that links the crate.
crate-type = ["cdylib", "rlib"]
# Doc-comment examples illustrate Python-facing usage, not compilable Rust.
doctest = false

[dependencies]
# extension-module is opt-in: bare `cargo test`/`cargo clippy` leave it off so
# the test harness links libpython; maturin turns it on for the wheel.
pyo3 = { version = "0.28.2" }
memchr = "2"     # SIMD-accelerated byte search
regex = "1"      # Compiled regex patterns
ignore = "0.4"   # Parallel directory walking

[build-dependencies]
odoo_build = { path = "../odoo_build" }

[features]
extension-module = ["pyo3/extension-module"]
